<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Safety for International Students — RNIMU</title>
<meta name="theme-color" content="#00843D">

<!-- This line connects the app to manifest.json, which is what lets a phone
     install it to the home screen. Without it, it is just a website. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* ============================================================
   COLOURS AND SIZES
   These are the safety colours used on real evacuation signs.
   Green means "this way out". Red means "never do this".
   Keep that meaning — do not use red for decoration.
   ============================================================ */
:root{
  --green:#00843D;        /* safety green — escape routes */
  --green-dark:#00632E;
  --red:#C8102E;          /* safety red — prohibitions only */
  --ink:#14261C;          /* text */
  --muted:#5A6B5F;        /* secondary text */
  --paper:#FFFFFF;
  --wash:#EFF4F0;         /* section background */
  --line:#CBD8CE;         /* hairlines */
  --calm:#23707E;         /* breathing exercise only — calm, not a safety colour */
  --calm-wash:#EAF3F5;
  --radius:10px;
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  /* No downloaded fonts on purpose: the app must work with no internet,
     and a font that fails to load is a font you cannot read. */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  color:var(--ink);
  background:var(--wash);
}

.page{max-width:520px;margin:0 auto;background:var(--paper);min-height:100vh}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.bar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.bar .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}

select{
  font:inherit;font-size:15px;padding:7px 10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);
}

/* ---------- emergency block ---------- */
/* This sits at the very top because it is the one thing someone needs
   to find in three seconds without reading anything else. */
.emergency{background:var(--green);color:#fff;padding:20px 18px 22px}
.emergency h2{margin:0 0 4px;font-size:15px;font-weight:600}
.emergency p{margin:0 0 14px;font-size:14px;opacity:.9}

.call{
  display:flex;align-items:baseline;gap:12px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  border-radius:var(--radius);
  padding:13px 16px;margin-bottom:8px;
  color:#fff;text-decoration:none;
}
.call:last-child{margin-bottom:0}
.call .num{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.call .who{font-size:14px;opacity:.92}
.call:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- sections ---------- */
.list{padding:8px 0 40px}

details{border-bottom:1px solid var(--line)}
summary{
  padding:16px 18px;cursor:pointer;font-weight:600;font-size:16px;
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:"\2013"}
summary:focus-visible{outline:3px solid var(--green);outline-offset:-3px}

.body{padding:0 18px 18px}
.body p{margin:0 0 12px}
.body ol,.body ul{margin:0 0 12px;padding-inline-start:22px}
.body li{margin-bottom:7px}
.body strong{font-weight:600}

/* A red rule marks a prohibition. Same meaning as a red sign on a wall. */
.never{
  border-inline-start:4px solid var(--red);
  background:#FCF2F3;
  padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0;
  margin:0 0 12px;
}
.never b{color:var(--red)}

.note{font-size:14px;color:var(--muted)}

/* ---------- footer ---------- */
footer{padding:22px 18px 40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer p{margin:0 0 8px}

#offline{
  display:none;background:var(--ink);color:#fff;
  padding:9px 18px;font-size:14px;text-align:center;
}
body.is-offline #offline{display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- quiz launch ---------- */
.quizLaunch{
  display:block;width:calc(100% - 36px);margin:16px 18px;
  background:var(--green);color:#fff;border:none;border-radius:var(--radius);
  padding:14px 16px;font:inherit;font-size:15px;font-weight:600;
  text-align:start;cursor:pointer;
}
.quizLaunch + .quizLaunch{margin-top:-6px}
.quizLaunch:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}
.quizLaunch .sub{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}

/* ---------- quiz flow ---------- */
#quizView{padding:0 0 40px}
.qTop{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.qBack{background:none;border:none;font:inherit;font-size:15px;color:var(--green-dark);cursor:pointer;padding:4px 0;font-weight:600}
.qDots{display:flex;gap:6px;margin-inline-start:auto}
.qDot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.qDot.on{background:var(--green)}

.qBody{padding:18px}
.qSectionTitle{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.qQuestion{margin:0 0 22px}
.qText{font-size:16px;font-weight:600;margin:0 0 12px;line-height:1.4}

.qOption{
  display:block;width:100%;text-align:start;
  padding:12px 14px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
}
.qOption.sel{border-color:var(--green);background:#EAF5EF;font-weight:600}
.qOption:focus-visible{outline:3px solid var(--green);outline-offset:1px}

.qInput{
  width:100%;padding:12px 14px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);
}

.qScale{display:flex;gap:8px;margin-bottom:6px}
.qScaleBtn{
  flex:1;padding:12px 0;text-align:center;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);font:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
}
.qScaleBtn.sel{border-color:var(--green);background:var(--green);color:#fff}
.qScaleLabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px}

.qErr{color:var(--red);font-size:13px;margin:4px 0 0}
.qIntro{font-size:15px;margin:0 0 20px}
.qKicker{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin:0 0 4px}
.qHelp{font-size:13px;color:var(--muted);margin:-8px 0 12px}
textarea.qInput{min-height:84px;resize:vertical;display:block}
.qCheck{position:relative;padding-inline-start:44px}
.qCheck::before{content:"";position:absolute;inset-inline-start:14px;top:50%;width:18px;height:18px;margin-top:-9px;border:2px solid var(--line);border-radius:4px;background:var(--paper)}
.qCheck.sel::before{content:"\2713";border-color:var(--green);background:var(--green);color:#fff;font-size:13px;line-height:18px;text-align:center}
.qScaleBtn{min-width:0}
.qScale.wide{gap:4px}
.qScale.wide .qScaleBtn{font-size:14px;padding:11px 0}
.qGridRow{margin:0 0 14px}
.qGridLabel{font-size:15px;margin:0 0 6px}
.qGridBtns{display:flex;gap:6px}
.qGridBtn{flex:1;min-width:0;padding:10px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.qGridBtn.na{flex:2.2;font-size:12px;font-weight:500;line-height:1.2;padding:6px 4px}
.qGridBtn.sel{border-color:var(--green);background:var(--green);color:#fff}
.qGridBtn:focus-visible,.qScaleBtn:focus-visible{outline:3px solid var(--green-dark);outline-offset:1px}
.qRank{font-size:20px;font-weight:700;margin:2px 0 18px}
.qReview{text-align:start;margin:24px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--wash)}
.qReview p{margin:0 0 10px;font-size:14px}
.qReview p:last-child{margin-bottom:0}
.qReviewTitle{font-weight:600;font-size:15px!important}

.qNav{display:flex;gap:10px;padding:6px 18px 18px}
.qBtn{
  flex:1;padding:13px 16px;border-radius:var(--radius);font:inherit;font-size:15px;font-weight:600;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
}
.qBtn.primary{background:var(--green);border-color:var(--green);color:#fff}
.qBtn:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}

/* ---------- videos ---------- */
.videos{padding:18px 18px 6px;border-bottom:1px solid var(--line)}
.videos h2{font-size:17px;font-weight:600;margin:0 0 2px}
.videos .vSub{font-size:14px;color:var(--muted);margin:0 0 12px}
.vGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vCard{margin:0 0 12px}
.vCard video{display:block;width:100%;aspect-ratio:9/16;background:#000;border-radius:var(--radius);object-fit:cover}
.vCard figcaption{font-size:14px;font-weight:600;margin-top:6px;line-height:1.3}
.qDone{padding:40px 22px;text-align:center}

/* ---------- floor plans ---------- */
.plans{padding:20px 18px 18px;background:var(--wash);border-bottom:1px solid var(--line)}
.plansHead{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.plansHead h2{font-size:17px;font-weight:600;margin:0}
.plansIcon{flex:none;width:36px;height:36px;border-radius:10px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.plans .vSub{margin:0 0 14px}
.plansNote{margin:12px 0 0}
.breathe{padding:20px 18px 18px;background:var(--calm-wash);border-bottom:1px solid var(--line)}
.breIcon{background:var(--calm)}
.breathe .vSub{margin:0 0 14px}
.breOpen{
  display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;
  background:var(--calm);color:#fff;border:none;border-radius:12px;
  font:inherit;font-size:16px;font-weight:600;text-align:start;cursor:pointer;
  box-shadow:0 1px 3px rgba(20,38,28,.12);
}
.breOpen:focus-visible{outline:3px solid #174E58;outline-offset:2px}
.breFlowerMini{flex:none;width:46px;height:46px;animation:breMini 10s ease-in-out infinite}
.breFlowerMini circle{fill:#BFEFF0;opacity:.55;mix-blend-mode:screen}
@keyframes breMini{0%{transform:scale(.62) rotate(-30deg)}40%{transform:scale(1) rotate(0)}100%{transform:scale(.62) rotate(-30deg)}}
.breNote{margin:12px 0 0}
#breView{
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 38%,#1F5C66 0%,#123C45 55%,#0B2830 100%);color:#fff;
  padding-bottom:env(safe-area-inset-bottom);
}
#breView[hidden]{display:none}
.breBar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;font-weight:600}
.breBar span{flex:1}
.breBar button{background:none;border:none;color:#fff;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.breStage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.breFlower{width:min(74vw,40vh,340px);height:auto;overflow:visible}
.breFlower circle{mix-blend-mode:screen}
#brePetals circle{fill:url(#brePetal)}
.breGlow{fill:#7FD8D4;opacity:.12}
.breCenter{display:flex;flex-direction:column;align-items:center;min-height:86px}
.brePhase{font-size:24px;font-weight:600;letter-spacing:.01em;min-height:1.3em}
.breCount{font-size:34px;font-weight:300;line-height:1.1;min-height:1.1em;opacity:.9}
.breHint{text-align:center;margin:0 18px 6px;min-height:1.5em;font-size:15px;opacity:.85}
.breControls{padding:6px 18px 18px;max-width:520px;width:100%;margin:0 auto}
.brePatterns{display:flex;gap:8px;justify-content:center;margin:0 0 6px}
.brePatterns button{
  flex:1;padding:9px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:transparent;color:#fff;font:inherit;font-size:14px;cursor:pointer;
}
.brePatterns button[aria-checked="true"]{background:#fff;color:#123C45;border-color:#fff;font-weight:600}
.breInfo{text-align:center;font-size:13px;opacity:.75;margin:0 0 12px;min-height:1.4em}
.breGo{width:100%;padding:14px;border:none;border-radius:12px;background:#BFEFF0;color:#0B2830;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.breGo:focus-visible,.brePatterns button:focus-visible,.breBar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.breFoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
.breVib{display:flex;align-items:center;gap:6px}
.floorMaps{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,38,28,.08)}
.mapRow{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
  background:var(--paper);border:none;border-bottom:1px solid var(--line);
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);text-align:start;cursor:pointer;
}
.mapRow:last-child{border-bottom:none}
.mapRow:focus-visible{outline:3px solid var(--green);outline-offset:-3px}
.mapNum{flex:none;width:38px;height:38px;border-radius:8px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.mapName{flex:1}
.mapThumb{flex:none;width:120px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--wash)}
.mapRow::after{content:"";flex:none;width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);margin-inline-end:4px}
[dir=rtl] .mapRow::after{transform:rotate(-135deg)}
.mapRow:active{background:var(--wash)}
#mapView{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#EEF2EF}
#mapView[hidden]{display:none}
.mapBar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;background:var(--green);color:#fff;font-weight:600}
.mapBar span{flex:1}
.mapBar button{background:none;border:none;color:#fff;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.mapScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;position:relative;background:#fff}
.mapScroll img{display:block;max-width:none;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mapLoading{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.mapLoading[hidden]{display:none}
.mapZoom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.mapZoom button{width:48px;height:48px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:26px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.mapZoom button:focus-visible,.mapBar button:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}
.qDone .score{font-size:40px;font-weight:700;color:var(--green-dark);margin:0 0 6px}

/* ---------- jump-to row ---------- */
.jump{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump a,.jump button{
  flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);
  font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer;
}
.jump svg{flex:none;color:var(--green)}
.jump a:focus-visible,.jump button:focus-visible{outline:3px solid var(--green);outline-offset:1px}
#guide,#first-aid,#plans,#videos,#breathe{scroll-margin-top:8px}
.list details{scroll-margin-top:8px}

/* ---------- install card ---------- */
.install{display:flex;align-items:center;gap:10px;margin:0 18px 14px;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--wash)}
.install[hidden]{display:none}
.installTxt{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--muted)}
.installTxt b{display:block;font-size:14px;color:var(--ink)}
.installBtn{flex:none;padding:8px 14px;border:none;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.installBtn[hidden]{display:none}
.installX{flex:none;background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:6px;cursor:pointer}

/* ---------- "what to say" button in the green emergency block ---------- */
.sayOpen{
  display:flex;align-items:center;gap:10px;width:100%;margin-top:2px;padding:11px 14px;
  border:1px dashed rgba(255,255,255,.6);border-radius:var(--radius);background:transparent;
  color:#fff;font:inherit;font-size:15px;font-weight:600;text-align:start;cursor:pointer;
}
.sayOpen svg{flex:none}
.sayOpen:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- section headings for the guide ---------- */
.guideHead{padding:20px 18px 2px}
.guideHead h2{font-size:17px;font-weight:600;margin:0}
.guideIcon{background:var(--ink)}
#guide .list{padding:4px 0 8px}

/* ---------- first aid ---------- */
.aid{padding:20px 18px 26px}
.aid .vSub{font-size:14px;color:var(--muted);margin:0 0 14px}
.aidFirstTitle{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin:0 0 6px}
.aidFirst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px;padding:0;list-style:none;counter-reset:first}
.aidFirst li{position:relative;margin:0;padding:30px 10px 10px;border-radius:10px;background:var(--wash);font-size:13px;line-height:1.35}
.aidFirst li::before{
  counter-increment:first;content:counter(first);position:absolute;top:8px;inset-inline-start:10px;
  width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.aidFirst b{display:block;font-size:14px;margin-bottom:1px}
html[lang="fa"] .aidFirst li::before{content:counter(first,persian)}
html[lang="fa"] .body ol{list-style-type:persian}
.nw{white-space:nowrap}
.aidList{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:0 1px 3px rgba(20,38,28,.08)}
.aidList details:last-child{border-bottom:none}
.aidList summary{justify-content:flex-start;padding:12px 14px}
.aidIco{flex:none;width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.aidHead{flex:1;min-width:0;display:flex;flex-direction:column}
.aidName{font-size:16px;font-weight:600;line-height:1.3}
.aidTag{font-size:13px;font-weight:400;color:var(--muted);line-height:1.35;margin-top:1px}
.aidList .body{padding:0 14px 16px}
.aidList details{scroll-margin-top:8px}
.aidNote{margin:12px 0 0}
.body ul ul,.body ol ul{margin:6px 0 4px;padding-inline-start:18px;list-style:disc}
.body a{color:var(--green-dark);font-weight:600}
.why{display:block;margin-top:3px;font-size:13.5px;line-height:1.45;color:var(--muted)}
/* A yellow rule means "warning / watch for this" — like a yellow warning sign. */
.warn{border-inline-start:4px solid #E0A400;background:#FFF7DE;padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0;margin:0 0 12px}
.warn b{color:#6A4B00}
.aidTool{
  display:flex;align-items:center;gap:12px;width:100%;margin:2px 0 14px;padding:11px 14px;
  border:none;border-radius:12px;background:var(--green-dark);color:#fff;
  font:inherit;text-align:start;cursor:pointer;box-shadow:0 1px 3px rgba(20,38,28,.15);
}
.aidTool.cool{background:#1D5F86}
.aidTool svg{flex:none}
.aidToolTxt{flex:1;min-width:0}
.aidToolTxt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.aidToolTxt small{display:block;font-size:12.5px;font-weight:400;opacity:.85;margin-top:1px}
.aidTool:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- first aid pictures ----------
   Each picture is a small drawing (SVG) moved with CSS. Phones that ask
   for less motion get the still picture (see prefers-reduced-motion above). */
.aidArt{margin:2px 0 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#F3F7F4}
.aidArt svg{display:block;width:100%;height:auto}
.aa text{font-family:inherit;font-weight:700}
.aa .fb{transform-box:fill-box;transform-origin:center}
.aa-flow{animation:aa-flow .7s linear infinite}
@keyframes aa-flow{to{stroke-dashoffset:-28}}
.aa-wind{animation:aa-wind 2.4s linear infinite}
@keyframes aa-wind{to{stroke-dashoffset:-56}}
.aa-go{animation:aa-go .9s linear infinite}
@keyframes aa-go{to{stroke-dashoffset:-14}}
.aa-burn{animation:aa-burn 6s ease-in-out infinite}
@keyframes aa-burn{0%,8%{opacity:.95}85%{opacity:.28}100%{opacity:.95}}
.aa-sp{animation:aa-sp1 .9s ease-out infinite both}
.aa-sp2{animation-name:aa-sp2;animation-delay:.22s}
.aa-sp3{animation-name:aa-sp3;animation-delay:.45s}
.aa-sp4{animation-name:aa-sp4;animation-delay:.67s}
@keyframes aa-sp1{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-17px,-9px);opacity:0}}
@keyframes aa-sp2{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(15px,-11px);opacity:0}}
@keyframes aa-sp3{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-7px,-15px);opacity:0}}
@keyframes aa-sp4{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(19px,-4px);opacity:0}}
.aa-drip{animation:aa-drip 1s linear infinite both}
.aa-drip2{animation-delay:.35s}
.aa-drip3{animation-delay:.7s}
@keyframes aa-drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.aa-heat{animation:aa-heat 2.4s ease-out infinite both}
.aa-heat2{animation-delay:.8s}
.aa-heat3{animation-delay:1.6s}
@keyframes aa-heat{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-13px);opacity:0}}
.aa-ring{animation:aa-ring 10s linear infinite}
@keyframes aa-ring{from{stroke-dashoffset:0}to{stroke-dashoffset:125.7}}
.aa-hand{transform-box:fill-box;transform-origin:50% 100%;animation:aa-spin 10s linear infinite}
@keyframes aa-spin{to{transform:rotate(360deg)}}
.aa-puff{transform-box:fill-box;transform-origin:center;animation:aa-puff 4.5s ease-out infinite both}
.aa-puff2{animation-delay:1.5s}
.aa-puff3{animation-delay:3s}
@keyframes aa-puff{0%{transform:translate(0,0) scale(.55);opacity:0}15%{opacity:.95}100%{transform:translate(24px,-46px) scale(1.5);opacity:0}}
.aa-co{animation:aa-co 5s ease-in-out infinite both}
.aa-co2{animation-delay:2.5s}
@keyframes aa-co{0%{transform:translate(0,0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(10px,-34px);opacity:0}}
.aa-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:aa-breathe 3.6s ease-in-out infinite}
@keyframes aa-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.aa-wave{animation:aa-wave 1.6s ease-out infinite both}
.aa-wave2{animation-delay:.3s}
@keyframes aa-wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.aa-rise{transform-box:fill-box;transform-origin:50% 100%;animation:aa-rise 3.6s ease-in-out infinite}
@keyframes aa-rise{0%,100%{transform:scale(1)}50%{transform:scale(1.02,1.07)}}
.aa-breath{animation:aa-breath 3.6s ease-out infinite both}
.aa-breath2{animation-delay:.25s}
@keyframes aa-breath{0%,45%{transform:translate(0,0);opacity:0}60%{opacity:.9}100%{transform:translate(4px,-6px);opacity:0}}
/* CPR: 110 pushes a minute = one every 0.545 s */
.aa-push{animation:aa-push .545s ease-in-out infinite}
@keyframes aa-push{0%,100%{transform:translateY(0)}45%{transform:translateY(4.5px)}}
.aa-beat{animation:aa-beat .545s ease-out infinite}
@keyframes aa-beat{0%,100%{opacity:0}40%{opacity:.8}}
.aa-fall{animation:aa-fall 1.1s linear infinite both}
.aa-fall2{animation-delay:.37s}
.aa-fall3{animation-delay:.74s}
@keyframes aa-fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(30px);opacity:0}}
/* electric shock: 1) sparks + "do not touch", 2) plug pulled out, 3) now help */
.aa-plug{animation:aa-plug 7s ease-in-out infinite}
@keyframes aa-plug{0%,34%{transform:translateX(0)}48%,94%{transform:translateX(26px)}100%{transform:translateX(0)}}
.aa-zap{animation:aa-zap 7s steps(1) infinite}
@keyframes aa-zap{0%{opacity:1}5%{opacity:.2}10%{opacity:1}15%{opacity:.4}20%{opacity:1}25%{opacity:.2}30%{opacity:1}38%,100%{opacity:0}}
.aa-stop{animation:aa-stop 7s ease-in-out infinite}
@keyframes aa-stop{0%,44%{opacity:1;transform:scale(1)}52%,100%{opacity:0;transform:scale(.6)}}
.aa-ok{opacity:0;animation:aa-ok 7s ease-in-out infinite}
@keyframes aa-ok{0%,50%{opacity:0;transform:scale(.6)}58%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
.aa-press{animation:aa-press 1.8s ease-in-out infinite}
@keyframes aa-press{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.aa-arrow{animation:aa-arrow 1.8s ease-in-out infinite}
@keyframes aa-arrow{0%,100%{transform:translateY(-3px);opacity:.5}50%{transform:translateY(2px);opacity:1}}
.aa-bleed{opacity:0;animation:aa-bleed 6s linear infinite}
.aa-bleed2{animation-delay:.6s}
@keyframes aa-bleed{0%{transform:translateY(0);opacity:0}4%{opacity:1}16%{transform:translateY(26px);opacity:0}100%{opacity:0}}
.aa-stain{transform-box:fill-box;transform-origin:center;animation:aa-stain 6s ease-out infinite}
@keyframes aa-stain{0%{transform:scale(.7)}40%,100%{transform:scale(1)}}

/* ---------- full-screen tools (cooling timer, CPR coach, what to say) ---------- */
.toolView{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:#fff;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
.toolView[hidden]{display:none}
.toolBar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;font-weight:600}
.toolBar span{flex:1}
.toolBar button{background:none;border:none;color:inherit;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.toolBar button:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.toolStage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.toolMsg{text-align:center;margin:0 18px 8px;min-height:1.5em;font-size:16px;font-weight:600}
.toolControls{padding:6px 18px 18px;max-width:520px;width:100%;margin:0 auto}
.toolGo{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#0B2830;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.toolGhost{width:100%;margin-top:8px;padding:11px;border:1px solid rgba(255,255,255,.4);border-radius:12px;background:transparent;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.toolGhost[hidden]{display:none}
.toolGo:focus-visible,.toolGhost:focus-visible{outline:3px solid #fff;outline-offset:2px}

#coolView{background:radial-gradient(120% 80% at 50% 35%,#236C96 0%,#154C6D 55%,#0C3148 100%)}
.coolDial{width:min(66vw,36vh,280px);height:auto;overflow:visible}
.coolCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.coolTime{font-size:clamp(40px,11vw,60px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.coolLeft{font-size:14px;opacity:.8;margin-top:6px}
.coolDrop{margin-bottom:8px;opacity:.9}
#coolView.run .coolDrop{animation:coolDrop 1.4s ease-in-out infinite}
@keyframes coolDrop{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.coolTips{list-style:none;margin:0 auto 6px;padding:0 18px;max-width:520px;width:100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.coolTips li{font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12)}

#cprView{background:radial-gradient(120% 80% at 50% 40%,#17402D 0%,#0F2C1F 55%,#091B13 100%)}
.cprCall{display:flex;align-items:baseline;justify-content:center;gap:10px;width:calc(100% - 36px);max-width:484px;margin:0 auto;padding:10px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.cprCall:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cprCall .num{font-size:22px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.cprPulse{position:relative;width:min(62vw,34vh,250px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(52,199,123,.28),rgba(52,199,123,.08) 70%);border:3px solid rgba(52,199,123,.55);transition:transform .09s ease-out,border-color .09s}
.cprPulse.hit{transform:scale(.93);border-color:#7EF0B0}
.cprPulse.breath{border-color:#8FD6FF;background:radial-gradient(circle at 50% 45%,rgba(143,214,255,.25),rgba(143,214,255,.06) 70%)}
.cprPulse svg{opacity:.95}
.cprCount{font-size:clamp(34px,10vw,54px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;min-height:1.05em}
.cprSwap{position:absolute;top:8px;left:18px;right:18px;margin:0 auto;max-width:480px;padding:10px 14px;border-radius:12px;background:#FFF7DE;color:#3D2E00;font-size:14px;font-weight:600;text-align:center}
.cprSwap[hidden]{display:none}

#sayView{background:var(--paper);color:var(--ink)}
#sayView .toolBar{background:var(--green);color:#fff}
.sayScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sayInner{max-width:520px;margin:0 auto;padding:14px 18px 32px}
.sayEn{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--wash);font-size:14px}
.sayInner h3{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin:18px 0 8px}
.sayOpts{display:flex;flex-direction:column;gap:6px}
.sayOpt,.sayChip{
  display:block;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);font:inherit;font-size:15px;color:var(--ink);text-align:start;cursor:pointer;
}
.sayOpt[aria-checked="true"],.sayChip[aria-pressed="true"]{border-color:var(--green);background:#EAF5EF;font-weight:600}
.sayOpt:focus-visible,.sayChip:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.sayChips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sayChip{padding:10px 12px;font-size:14px}
.sayHouses{display:flex;gap:6px;margin:0 0 4px}
.sayHouses button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.sayHouses button[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#fff}
.sayHouses[hidden],.sayOther[hidden]{display:none}
.sayOther{margin:0 0 4px}
.sayRow{display:flex;gap:8px;margin-top:8px}
.sayRow label{flex:1;font-size:13px;color:var(--muted)}
.sayRow input:focus-visible,.sayOther:focus-visible{outline:3px solid var(--green);outline-offset:1px}
.sayRow input,.sayOther{display:block;width:100%;margin-top:3px;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink)}
.sayOut{margin-top:18px;padding:14px;border-radius:12px;background:#10261B;color:#fff}
.sayOut .sayLbl{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;opacity:.75}
.sayRu{margin:0;font-size:20px;font-weight:600;line-height:1.4}
.sayTr{margin:6px 0 0;font-size:14px;opacity:.75;line-height:1.4}
.sayBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sayBtns button,.sayBtns a{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.sayBtns a{background:var(--green);border-color:var(--green)}
.sayBtns [hidden]{display:none}
.sayNoVoice{margin:10px 0 0;font-size:13px;opacity:.8}
.sayNoVoice[hidden]{display:none}
.sayPh{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sayPh:last-child{border-bottom:none}
.sayPhTxt{flex:1;min-width:0}
.sayPhTxt .ru{display:block;font-weight:600;font-size:16px}
.sayPhTxt .tr{display:block;font-size:13px;color:var(--muted)}
.sayPhTxt .mean{display:block;font-size:14px;margin-top:2px}
.sayPlay{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--green-dark);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sayPlay[hidden]{display:none}
.sayPlay:focus-visible{outline:3px solid var(--green);outline-offset:1px}
#sayBig{position:fixed;inset:0;z-index:70;background:#FFF;color:#000;display:flex;flex-direction:column;justify-content:center;padding:24px;cursor:pointer}
#sayBig[hidden]{display:none}
#sayBig p{margin:0;font-size:clamp(28px,8.5vw,60px);font-weight:700;line-height:1.25}
#sayBig small{display:block;margin-top:24px;font-size:14px;color:#555}
</style>
</head>

<body>
<div class="page">

  <div class="bar">
    <h1><span id="appTitle">Fire Safety for International Students</span>
      <span class="sub" id="buildingLabel">RNIMU — Ostrovityanova 1</span>
    </h1>
    <!-- Add a new <option> here when you add a language below. -->
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="fa">فارسی</option>
    </select>
  </div>

  <div id="offline">Offline — everything here still works.</div>

  <section class="emergency">
    <h2 id="emTitle"></h2>
    <p id="emSub"></p>
    <a class="call" href="tel:112"><span class="num">112</span><span class="who" id="who112"></span></a>
    <a class="call" href="tel:101"><span class="num">101</span><span class="who" id="who101"></span></a>
    <a class="call" href="tel:+74954345192"><span class="num">+7 495 434-51-92</span><span class="who" id="whoDuty"></span></a>
    <!-- Opens the "what to say when you call 112" helper (CALL HELPER in the script). -->
    <button type="button" class="sayOpen" id="sayOpen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
      <span id="sayOpenLbl"></span>
    </button>
  </section>

  <!-- One button per questionnaire level (SURVEYS in the script, in this order). -->
  <button class="quizLaunch" id="quizLaunchBtn0" type="button">
    <span id="quizLaunchTitle0"></span>
    <span class="sub" id="quizLaunchSub0"></span>
  </button>
  <button class="quizLaunch" id="quizLaunchBtn1" type="button">
    <span id="quizLaunchTitle1"></span>
    <span class="sub" id="quizLaunchSub1"></span>
  </button>

  <div id="infoView">
    <!-- QUICK LINKS to each part of the page (words in NAV_UI in the script). -->
    <nav class="jump" id="jump" aria-label="Go to">
      <a href="#guide" data-nav="fire"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 3.2-2.4 4.6-2.4 7.6 0 1.3.9 2.2 2 2.2 1.5 0 2.2-1.4 1.8-3.3 2.4 1.4 3.9 3.8 3.9 6.3A5.3 5.3 0 0 1 12 21a5.3 5.3 0 0 1-5.3-5.2C6.7 11 10 8.4 12 3z"/></svg><span></span></a>
      <a href="#first-aid" data-nav="aid"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/></svg><span></span></a>
      <button type="button" data-nav="say"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span></span></button>
      <a href="#plans" data-nav="plans"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span></span></a>
      <a href="#videos" data-nav="videos"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.2l5 2.8-5 2.8z"/></svg><span></span></a>
      <a href="#breathe" data-nav="breathe"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg><span></span></a>
    </nav>

    <!-- "Install this guide" card: only shown when the phone can install it. -->
    <div class="install" id="installCard" hidden>
      <div class="installTxt"><b id="instTitle"></b><span id="instSub"></span></div>
      <button type="button" class="installBtn" id="instBtn" hidden></button>
      <button type="button" class="installX" id="instX" aria-label="Hide">✕</button>
    </div>

    <!-- VIDEOS: to add one, put the .mp4 (and a .jpg preview) in the videos
         folder, then add a <figure> below and its title in CONTENT (vid1, vid2…). -->
    <section class="videos" id="videos">
      <h2 id="vidTitle"></h2>
      <p class="vSub" id="vidSub"></p>
      <div class="vGrid">
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-university.jpg" src="evacuation-university.mp4"></video>
          <figcaption id="vid1"></figcaption>
        </figure>
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-dormitory.jpg" src="evacuation-dormitory.mp4"></video>
          <figcaption id="vid2"></figcaption>
        </figure>
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-smoke.jpg" src="evacuation-smoke.mp4"></video>
          <figcaption id="vid3"></figcaption>
        </figure>
      </div>
    </section>

    <!-- FLOOR PLANS: the list of floors is filled in from FLOOR_MAPS in the script. -->
    <section class="plans" id="plans" aria-labelledby="plansTitle">
      <div class="plansHead">
        <span class="plansIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
        </span>
        <h2 id="plansTitle"></h2>
      </div>
      <p class="vSub" id="plansSub"></p>
      <div class="floorMaps" id="floorMaps"></div>
      <p class="note plansNote" id="plansNote"></p>
    </section>

    <!-- BREATHING EXERCISE: the full-screen part is at the bottom of the page. -->
    <section class="breathe" id="breathe" aria-labelledby="breTitle">
      <div class="plansHead">
        <span class="plansIcon breIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
        </span>
        <h2 id="breTitle"></h2>
      </div>
      <p class="vSub" id="breSub"></p>
      <button type="button" class="breOpen" id="breOpen">
        <svg class="breFlowerMini" viewBox="0 0 100 100" aria-hidden="true"><g><circle cx="66.0" cy="50.0" r="22"/><circle cx="58.0" cy="63.9" r="22"/><circle cx="42.0" cy="63.9" r="22"/><circle cx="34.0" cy="50.0" r="22"/><circle cx="42.0" cy="36.1" r="22"/><circle cx="58.0" cy="36.1" r="22"/></g></svg>
        <span id="breBtn"></span>
      </button>
      <p class="note breNote" id="breNote"></p>
    </section>
    <!-- IN A FIRE: the cards are filled in from CONTENT (sections) in the script. -->
    <section id="guide" aria-labelledby="guideTitle">
      <div class="plansHead guideHead">
        <span class="plansIcon guideIcon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 3.2-2.4 4.6-2.4 7.6 0 1.3.9 2.2 2 2.2 1.5 0 2.2-1.4 1.8-3.3 2.4 1.4 3.9 3.8 3.9 6.3A5.3 5.3 0 0 1 12 21a5.3 5.3 0 0 1-5.3-5.2C6.7 11 10 8.4 12 3z"/></svg></span>
        <h2 id="guideTitle"></h2>
      </div>
      <div class="list" id="list"></div>
    </section>

    <!-- FIRST AID: words from CONTENT (aid), pictures from AID_ART in the script. -->

const listEl = document.getElementById('list');
const langEl = document.getElementById('lang');

// Address of each "In a fire" card, in order, so a link like …/#fire-clothing
// opens it (a section can also set its own: { id:"...", title:"...", html:`...` }).
const GUIDE_IDS = ['fire-alarm','fire-see','fire-smoke','fire-trapped','fire-clothing','fire-extinguisher','fire-banned'];

function render(code){
  const c = CONTENT[code];
  if(!c) return;

  document.documentElement.lang = code;
  // Persian and Arabic read right to left.
  document.documentElement.dir = (code === 'fa' || code === 'ar') ? 'rtl' : 'ltr';

  document.getElementById('appTitle').textContent = c.appTitle;
  document.title = c.appTitle + ' — RNIMU';
  ['vidTitle','vidSub','vid1','vid2','vid3','plansTitle','plansSub','plansNote','breTitle','breSub','breBtn','breNote',
   'guideTitle','aidTitle','aidSub','aidFirstTitle','aidNote'].forEach(id => {
    document.getElementById(id).textContent = c[id] || CONTENT.en[id];
  });
  document.getElementById('emTitle').textContent = c.emTitle;
  document.getElementById('emSub').textContent   = c.emSub;
  document.getElementById('who112').textContent  = c.who112;
  document.getElementById('who101').textContent  = c.who101;
  document.getElementById('whoDuty').textContent = c.whoDuty;
  document.getElementById('foot').innerHTML      = c.foot;

  const wasOpen = openDetails(listEl);
  listEl.innerHTML = c.sections.map((s, i) => {
    const id = s.id || GUIDE_IDS[i];
    return `
    <details${id ? ` id="${id}"` : ''}>
      <summary>${s.title}</summary>
      <div class="body">${s.html}</div>
    </details>`;
  }).join('');
  reopenDetails(listEl, wasOpen);
  // Floor plans are filled in by the FLOOR PLANS script further down, once it has loaded.
  if(window.floorMapsReady) renderFloorMaps(code);
  // So are the first aid cards, the quick links and the tools.
  if(window.aidReady) renderExtras(code);

  try{ localStorage.setItem('lang', code); }catch(e){}
}

// Remember the chosen language, or guess from the phone's settings.
let start = 'en';
try{ start = localStorage.getItem('lang') || (navigator.language || 'en').slice(0,2); }catch(e){}
if(!CONTENT[start]) start = 'en';
langEl.value = start;
render(start);
// NOTE: the quiz card is filled in at the very bottom of this script instead
// of here. SURVEY is defined further down, and a const cannot be read before
// the line that defines it has run — doing it here threw an error that stopped
// the whole script, which killed the quiz AND the language switcher.

langEl.addEventListener('change', e => {
  render(e.target.value);
  renderQuizLaunch();
  if(!document.getElementById('quizView').hidden) renderQuizSection();
});

// Tell the user when they are offline, so they trust that it still works.
function netStatus(){ document.body.classList.toggle('is-offline', !navigator.onLine); }
window.addEventListener('online', netStatus);
window.addEventListener('offline', netStatus);
netStatus();

// This starts the service worker, which is what saves the app for offline use.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}

const SURVEYS = [SURVEY_L1, SURVEY_L2];
let SURVEY = SURVEY_L2;   // whichever level is open right now

let quizState = { section:0, answers:{}, order:{}, done:false };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// "A. 1 — Not at all confident" -> "1" (in Persian digits for fa)
function scaleNum(v, L){
  const n = (String(v).match(/\d+/) || [String(v)])[0];
  return L === 'fa' ? n.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : n;
}

function allQuestions(){
  return SURVEY.sections.reduce((all, s) => all.concat(s.questions), []);
}

function renderQuizLaunch(){
  SURVEYS.forEach((sv, i) => {
    const L = sv.launch[langEl.value] ? langEl.value : 'en';
    document.getElementById('quizLaunchTitle' + i).textContent = sv.launch[L].title;
    document.getElementById('quizLaunchSub' + i).textContent = sv.launch[L].sub;
  });
}

function openQuiz(level){
  SURVEY = SURVEYS[level];
  quizState = { section:0, answers:{}, order:{}, done:false };
  // Shuffle the options of scored questions once per attempt.
  allQuestions().forEach(q => {
    if(q.correct && q.shuffle !== false){
      const idx = q.options.map((o,i) => i);
      for(let i = idx.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
      quizState.order[q.id] = idx;
    }
  });
  document.getElementById('infoView').hidden = true;
  document.getElementById('quizView').hidden = false;
  window.scrollTo(0, 0);
  renderQuizSection();
}

function closeQuiz(){
  document.getElementById('quizView').hidden = true;
  document.getElementById('infoView').hidden = false;
}

function isAnswered(q){
  const v = quizState.answers[q.id];
  if(q.type === 'checkbox') return Array.isArray(v) && v.length > 0;
  if(q.type === 'grid') return !!v && q.rows.every((r,i) => v[i] !== undefined);
  return v !== undefined && String(v).trim() !== '';
}

function renderQuizSection(){
  const L = SURVEY.ui[langEl.value] ? langEl.value : 'en';
  const ui = SURVEY.ui[L];
  const view = document.getElementById('quizView');

  if(quizState.done){
    const scored = allQuestions().filter(q => q.correct);
    const missed = scored.filter(q => quizState.answers[q.id] !== q.correct);
    const correct = scored.length - missed.length;
    const rank = SURVEY.ranks ? SURVEY.ranks.find(r => correct >= r.min) : null;
    const review = missed.length ? `
        <div class="qReview">
          <p class="qReviewTitle">${ui.reviewTitle}</p>
          ${missed.map(q => {
            const right = q.options.find(o => o.value === q.correct);
            return `<p><b>${(q.kicker && q.kicker[L]) || ''}</b><br>${ui.correctLabel} ${right.label[L]}</p>`;
          }).join('')}
        </div>` : '';
    view.innerHTML = `
      <div class="qTop"><button class="qBack" id="qBackBtn" type="button">${ui.back}</button></div>
      <div class="qDone">
        <p style="font-weight:600;font-size:17px;margin:0 0 18px">${ui.doneTitle}</p>
        <p class="score">${correct}/${scored.length}</p>
        <p class="note" style="margin:0 0 18px">${ui.doneScore}</p>
        ${rank ? `<p class="note" style="margin:0">${ui.rankLabel}</p>
        <p class="qRank">${rank.label[L]}</p>` : ''}
        <p class="note">${ui.doneBody}</p>
        ${review}
      </div>
      <div class="qNav"><button class="qBtn primary" id="qDoneBtn" type="button">${ui.doneBtn}</button></div>`;
    document.getElementById('qBackBtn').onclick = closeQuiz;
    document.getElementById('qDoneBtn').onclick = closeQuiz;
    return;
  }

  const section = SURVEY.sections[quizState.section];
  const isLast = quizState.section === SURVEY.sections.length - 1;
  const isFirst = quizState.section === 0;
  const dots = SURVEY.sections.map((s,i) => `<span class="qDot${i===quizState.section?' on':''}"></span>`).join('');

  const qHtml = section.questions.map(q => {
    const val = quizState.answers[q.id];
    let inputHtml = '';
    if(q.type === 'text'){
      inputHtml = `<input class="qInput" type="text" data-qid="${q.id}" placeholder="${esc((q.placeholder && q.placeholder[L]) || '')}" value="${val ? esc(val) : ''}">`;
    } else if(q.type === 'long'){
      inputHtml = `<textarea class="qInput" rows="3" data-qid="${q.id}">${val ? esc(val) : ''}</textarea>`;
    } else if(q.type === 'radio'){
      const order = quizState.order[q.id] || q.options.map((o,i) => i);
      inputHtml = order.map(i => q.options[i]).map(o => `
        <button type="button" class="qOption${val===o.value?' sel':''}" data-qid="${q.id}" data-val="${esc(o.value)}">${o.label[L]}</button>`).join('');
    } else if(q.type === 'checkbox'){
      const picked = Array.isArray(val) ? val : [];
      inputHtml = q.options.map(o => `
        <button type="button" class="qOption qCheck${picked.includes(o.value)?' sel':''}" aria-pressed="${picked.includes(o.value)}" data-qid="${q.id}" data-check="${esc(o.value)}">${o.label[L]}</button>`).join('');
    } else if(q.type === 'scale'){
      const wide = q.values.length > 6 ? ' wide' : '';
      inputHtml = `
        <div class="qScale${wide}">${q.values.map((v,i) => `<button type="button" class="qScaleBtn${val===v?' sel':''}" data-qid="${q.id}" data-val="${esc(v)}">${scaleNum(v, L)}</button>`).join('')}</div>
        ${q.low ? `<div class="qScaleLabels"><span>${q.low[L]}</span><span>${q.high[L]}</span></div>` : '<div style="height:12px"></div>'}`;
    } else if(q.type === 'grid'){
      const g = val || {};
      inputHtml = q.rows.map((r,ri) => `
        <div class="qGridRow">
          <p class="qGridLabel">${r.label[L]}</p>
          <div class="qGridBtns">${q.columns.map(c => `<button type="button" class="qGridBtn${c.na?' na':''}${g[ri]===c.value?' sel':''}" data-qid="${q.id}" data-row="${ri}" data-val="${esc(c.value)}">${c.label[L]}</button>`).join('')}</div>
        </div>`).join('');
    }
    return `
      <div class="qQuestion">
        ${q.kicker ? `<p class="qKicker">${q.kicker[L]}</p>` : ''}
        <p class="qText">${q.text[L]}</p>
        ${q.help ? `<p class="qHelp">${q.help[L]}</p>` : ''}
        ${inputHtml}
        <p class="qErr" data-qerr="${q.id}" hidden>${ui.required}</p>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="qTop">
      <button class="qBack" id="qBackBtn" type="button">${isFirst ? ui.back : (L==='fa' ? '→' : '←')}</button>
      <div class="qDots">${dots}</div>
    </div>
    <div class="qBody">
      <p class="qSectionTitle">${section.title[L]}</p>
      ${section.intro ? `<p class="qIntro">${section.intro[L]}</p>` : ''}
      ${qHtml}
    </div>
    <div class="qNav"><button class="qBtn primary" id="qNextBtn" type="button">${isLast ? ui.submit : ui.next}</button></div>`;

  document.getElementById('qBackBtn').onclick = () => {
    if(isFirst){ closeQuiz(); } else { quizState.section--; renderQuizSection(); window.scrollTo(0, 0); }
  };

  view.querySelectorAll('.qInput').forEach(el => {
    el.oninput = () => { quizState.answers[el.dataset.qid] = el.value; };
  });
  view.querySelectorAll('.qOption[data-val], .qScaleBtn').forEach(el => {
    el.onclick = () => { quizState.answers[el.dataset.qid] = el.dataset.val; renderQuizSection(); };
  });
  view.querySelectorAll('.qCheck').forEach(el => {
    el.onclick = () => {
      const q = allQuestions().find(x => x.id === el.dataset.qid);
      let picked = Array.isArray(quizState.answers[q.id]) ? quizState.answers[q.id].slice() : [];
      const v = el.dataset.check;
      if(picked.includes(v)){
        picked = picked.filter(x => x !== v);
      } else if(v === q.exclusive){
        picked = [v];
      } else {
        picked = picked.filter(x => x !== q.exclusive).concat(v);
      }
      // Keep the same order as the Google Form.
      quizState.answers[q.id] = q.options.map(o => o.value).filter(x => picked.includes(x));
      renderQuizSection();
    };
  });
  view.querySelectorAll('.qGridBtn').forEach(el => {
    el.onclick = () => {
      const g = Object.assign({}, quizState.answers[el.dataset.qid] || {});
      g[el.dataset.row] = el.dataset.val;
      quizState.answers[el.dataset.qid] = g;
      renderQuizSection();
    };
  });

  document.getElementById('qNextBtn').onclick = () => {
    let ok = true, firstErr = null;
    section.questions.forEach(q => {
      const errEl = view.querySelector(`[data-qerr="${q.id}"]`);
      if(!q.optional && !isAnswered(q)){
        ok = false;
        if(errEl){ errEl.hidden = false; if(!firstErr) firstErr = errEl; }
      } else if(errEl){ errEl.hidden = true; }
    });
    if(!ok){ firstErr.parentElement.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    if(isLast){ submitQuiz(); } else { quizState.section++; renderQuizSection(); window.scrollTo(0, 0); }
  };
}

function submitQuiz(){
  const L = SURVEY.ui[langEl.value] ? langEl.value : 'en';
  if(!navigator.onLine){ alert(SURVEY.ui[L].offline); return; }

  const body = new URLSearchParams();
  allQuestions().forEach(q => {
    const v = quizState.answers[q.id];
    if(q.type === 'grid'){
      q.rows.forEach((r,i) => body.append(r.entry, (v && v[i]) || ''));
    } else if(q.type === 'checkbox'){
      (v || []).forEach(x => body.append(q.entry, x));
    } else {
      body.append(q.entry, v === undefined ? '' : String(v).trim());
    }
  });
  body.append('pageHistory', SURVEY.pageHistory);
  body.append('fvv', '1');

  // Google does not let the page see its reply (cross-origin), so we show
  // our own results screen either way.
  fetch(SURVEY.formBase, { method:'POST', mode:'no-cors', body }).catch(() => {});

  quizState.done = true;
  renderQuizSection();
  window.scrollTo(0, 0);
}


/* ============================================================
   FLOOR PLANS

   The images live in the "maps" folder: floor-N.webp is the full plan
   (opened on tap, then saved on the phone for offline use) and
   floor-N-small.webp is the little preview in the list.
   To add a floor or a building, make both files and add a line below.
   ============================================================ */

const FLOOR_MAPS = [
  { file:'maps/floor-4', num:{en:'4', ru:'4', fa:'۴'}, label:{en:'4th floor', ru:'4 этаж', fa:'طبقهٔ چهارم'} },
  { file:'maps/floor-3', num:{en:'3', ru:'3', fa:'۳'}, label:{en:'3rd floor', ru:'3 этаж', fa:'طبقهٔ سوم'} },
  { file:'maps/floor-2', num:{en:'2', ru:'2', fa:'۲'}, label:{en:'2nd floor', ru:'2 этаж', fa:'طبقهٔ دوم'} },
  { file:'maps/floor-1', num:{en:'1', ru:'1', fa:'۱'}, label:{en:'1st floor', ru:'1 этаж', fa:'طبقهٔ اول'} },
  { file:'maps/floor-0', num:{en:'LG', ru:'Ц', fa:'ز'}, label:{en:'Lower ground floor', ru:'Цокольный этаж', fa:'طبقهٔ زیرزمین'} }
];
const MAP_UI = {
  en:{ loading:'Loading the plan…', offline:'This plan has not been saved yet. Open it once with internet, then it works offline.', close:'Close', zoomIn:'Zoom in', zoomOut:'Zoom out' },
  ru:{ loading:'Загружаем план…', offline:'Этот план ещё не сохранён. Откройте его один раз с интернетом — потом он будет работать без сети.', close:'Закрыть', zoomIn:'Увеличить', zoomOut:'Уменьшить' },
  fa:{ loading:'در حال بارگذاری نقشه…', offline:'این نقشه هنوز ذخیره نشده است. یک بار با اینترنت بازش کنید تا بعداً بدون اینترنت هم کار کند.', close:'بستن', zoomIn:'بزرگ‌نمایی', zoomOut:'کوچک‌نمایی' }
};

function mapLang(){ return MAP_UI[langEl.value] ? langEl.value : 'en'; }

function renderFloorMaps(code){
  const L = MAP_UI[code] ? code : 'en';
  const box = document.getElementById('floorMaps');
  if(!box) return;
  box.innerHTML = FLOOR_MAPS.map((m,i) => `
    <button type="button" class="mapRow" data-map="${i}">
      <span class="mapNum">${m.num[L]}</span>
      <span class="mapName">${m.label[L]}</span>
      <img class="mapThumb" src="${m.file}-small.webp" alt="" loading="lazy" width="120" height="38">
    </button>`).join('');
  box.querySelectorAll('.mapRow').forEach(b => { b.onclick = () => openMap(+b.dataset.map); });
}

const mapView = document.getElementById('mapView');
const mapScroll = document.getElementById('mapScroll');
const mapImg = document.getElementById('mapImg');
let mapZoom = 1, mapMaxZoom = 8, mapOpenedFrom = null;

// zoom = 1 means "the whole plan fits the screen width"
function setMapZoom(z, cx, cy){
  if(!mapImg.naturalWidth) return;
  const W = mapScroll.clientWidth, H = mapScroll.clientHeight;
  if(cx === undefined){ cx = W / 2; cy = H / 2; }
  z = Math.max(1, Math.min(mapMaxZoom, z));
  const oldW = mapImg.offsetWidth || W, oldH = mapImg.offsetHeight || W;
  const fx = (mapScroll.scrollLeft + cx) / oldW;
  const fy = (mapScroll.scrollTop + cy) / oldH;
  mapZoom = z;
  mapImg.style.width = Math.round(W * z) + 'px';
  mapScroll.scrollLeft = fx * mapImg.offsetWidth - cx;
  mapScroll.scrollTop = fy * mapImg.offsetHeight - cy;
}

function openMap(i){
  const m = FLOOR_MAPS[i], L = mapLang(), ui = MAP_UI[L];
  mapOpenedFrom = document.activeElement;
  document.getElementById('mapTitle').textContent = m.label[L];
  document.getElementById('mapClose').setAttribute('aria-label', ui.close);
  document.getElementById('mapIn').setAttribute('aria-label', ui.zoomIn);
  document.getElementById('mapOut').setAttribute('aria-label', ui.zoomOut);
  const loading = document.getElementById('mapLoading');
  loading.textContent = ui.loading;
  loading.hidden = false;
  mapImg.style.visibility = 'hidden';
  mapImg.alt = m.label[L];
  mapView.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ floorMap:i }, '');
  mapImg.onload = () => {
    loading.hidden = true;
    mapImg.style.visibility = '';
    const W = mapScroll.clientWidth, H = mapScroll.clientHeight;
    mapMaxZoom = Math.max(2, mapImg.naturalWidth / W);
    mapImg.style.width = W + 'px';
    mapZoom = 1;
    // On a tall phone screen, start zoomed in so the plan fills the height.
    setMapZoom(Math.min(3, H * (mapImg.naturalWidth / mapImg.naturalHeight) / W), W / 2, 0);
    mapScroll.scrollTop = 0;
  };
  mapImg.onerror = () => { loading.textContent = navigator.onLine ? ui.loading : ui.offline; };
  mapImg.removeAttribute('src');
  mapImg.src = m.file + '.webp';
  document.getElementById('mapClose').focus();
}

function hideMap(){
  if(mapView.hidden) return;
  mapView.hidden = true;
  document.body.style.overflow = '';
  if(mapOpenedFrom && mapOpenedFrom.focus) mapOpenedFrom.focus();
}
// The phone's back button closes the plan instead of leaving the site.
window.addEventListener('popstate', hideMap);
document.getElementById('mapClose').onclick = () => { if(history.state && history.state.floorMap !== undefined) history.back(); else hideMap(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !mapView.hidden) document.getElementById('mapClose').click(); });
document.getElementById('mapIn').onclick = () => setMapZoom(mapZoom * 1.6);
document.getElementById('mapOut').onclick = () => setMapZoom(mapZoom / 1.6);

// Two-finger pinch to zoom around the fingers.
let pinch = null, lastTap = 0;
const touchDist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
mapScroll.addEventListener('touchstart', e => {
  if(e.touches.length === 2){ pinch = { d: touchDist(e.touches[0], e.touches[1]), z: mapZoom }; }
}, { passive:true });
mapScroll.addEventListener('touchmove', e => {
  if(!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches, r = mapScroll.getBoundingClientRect();
  setMapZoom(pinch.z * touchDist(a, b) / pinch.d, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top);
}, { passive:false });
mapScroll.addEventListener('touchend', e => {
  if(e.touches.length < 2) pinch = null;
  // Double-tap: zoom in, or back out when already fully zoomed.
  if(e.touches.length === 0 && e.changedTouches.length === 1){
    const now = Date.now(), t = e.changedTouches[0], r = mapScroll.getBoundingClientRect();
    if(now - lastTap < 300){
      setMapZoom(mapZoom >= mapMaxZoom * 0.95 ? 1 : mapZoom * 2, t.clientX - r.left, t.clientY - r.top);
      lastTap = 0;
    } else lastTap = now;
  }
});
// iPhone Safari: stop the whole page from zooming instead of the plan.
['gesturestart','gesturechange'].forEach(ev => mapScroll.addEventListener(ev, e => e.preventDefault()));
// Computer: Ctrl + mouse wheel (or trackpad pinch) zooms, double-click zooms in.
mapScroll.addEventListener('wheel', e => {
  if(!e.ctrlKey) return;
  e.preventDefault();
  const r = mapScroll.getBoundingClientRect();
  setMapZoom(mapZoom * Math.exp(-e.deltaY / 300), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
mapScroll.addEventListener('dblclick', e => {
  const r = mapScroll.getBoundingClientRect();
  setMapZoom(mapZoom >= mapMaxZoom * 0.95 ? 1 : mapZoom * 2, e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener('resize', () => { if(!mapView.hidden) setMapZoom(mapZoom); });

       in:'دم', out:'بازدم', hold:'نگه دارید', rest:'نگه دارید',
       hint:{ in:'آرام، از راه بینی', out:'آرام، از راه دهان', hold:'آرام بمانید', rest:'آرام بمانید' },
       ready:'روی «شروع» بزنید و همراه گل نفس بکشید',

};

const breView = document.getElementById('breView');
const brePetals = [];
(function makePetals(){
  const g = document.getElementById('brePetals');
  for(let i = 0; i < 6; i++){
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    g.appendChild(c); brePetals.push(c);
  }
})();
const breReduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let bre = { pattern:'calm', running:false, started:false, i:0, phaseStart:0, pausedAt:0, elapsed:0, runStart:0, p:0.2, lastCount:null, lastSec:-1, wake:null, from:null };

function breL(){ return BREATH_UI[langEl.value] ? langEl.value : 'en'; }
function breDigits(n){ const s = String(n); return breL() === 'fa' ? s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : s; }
const breEase = t => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));

function drawFlower(p){
  bre.p = p;
  const q = breReduced ? 0.35 + 0.3 * p : p;          // smaller movement if the phone asks for less motion
  const R = 36 * q, r = 24 + 28 * q, rot = -60 * (1 - q);
  brePetals.forEach((c, i) => {
    const a = (i * 60 + rot) * Math.PI / 180;
    c.setAttribute('cx', (100 + R * Math.cos(a)).toFixed(2));
    c.setAttribute('cy', (100 + R * Math.sin(a)).toFixed(2));
    c.setAttribute('r', r.toFixed(2));
  });
  const glow = document.getElementById('breGlow');
  glow.setAttribute('r', (46 + 50 * q).toFixed(2));
  glow.style.opacity = (0.08 + 0.12 * q).toFixed(3);
}

function breTexts(){
  const ui = BREATH_UI[breL()];
  document.getElementById('breViewTitle').textContent = ui.title;
  document.getElementById('breClose').setAttribute('aria-label', ui.close);
  document.getElementById('breVibLabel').textContent = ui.vib;
  document.getElementById('breGo').textContent = bre.running ? ui.pause : (bre.started ? ui.resume : ui.start);
  document.getElementById('breInfo').textContent = ui.patterns[bre.pattern].info;
  const box = document.getElementById('brePatterns');
  box.innerHTML = Object.keys(BREATH_PATTERNS).map(k =>
    `<button type="button" role="radio" aria-checked="${k === bre.pattern}" data-pat="${k}">${ui.patterns[k].label}</button>`).join('');
  box.querySelectorAll('button').forEach(b => { b.onclick = () => breSetPattern(b.dataset.pat); });
  if(!bre.started){
    document.getElementById('brePhase').textContent = '';
    document.getElementById('breCount').textContent = '';
    document.getElementById('breHint').textContent = ui.ready;
  }
}

function breShowPhase(){
  const ui = BREATH_UI[breL()], ph = BREATH_PATTERNS[bre.pattern][bre.i];
  document.getElementById('brePhase').textContent = ui[ph.k];
  document.getElementById('breHint').textContent = ui.hint[ph.k];
  const vib = document.getElementById('breVib');
  if(vib.checked && navigator.vibrate) navigator.vibrate(ph.k === 'in' ? 60 : ph.k === 'out' ? [30, 60, 30] : 20);
}

function breFrame(now){
  if(!bre.running) return;
  const pat = BREATH_PATTERNS[bre.pattern];
  let ph = pat[bre.i], t = (now - bre.phaseStart) / 1000;
  while(t >= ph.d){
    bre.phaseStart += ph.d * 1000;
    bre.i = (bre.i + 1) % pat.length;
    ph = pat[bre.i];
    t = (now - bre.phaseStart) / 1000;
    breShowPhase();
  }
  const e = breEase(t / ph.d);
  drawFlower(ph.k === 'in' ? e : ph.k === 'out' ? 1 - e : ph.k === 'hold' ? 1 : 0);
  const count = Math.max(1, Math.ceil(ph.d - t));
  if(count !== bre.lastCount){ bre.lastCount = count; document.getElementById('breCount').textContent = breDigits(count); }
  const sec = Math.floor((bre.elapsed + now - bre.runStart) / 1000);
  if(sec !== bre.lastSec){
    bre.lastSec = sec;
    document.getElementById('breTime').textContent = breDigits(Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
  }
  requestAnimationFrame(breFrame);
}

async function breWake(on){
  try{
    if(on && 'wakeLock' in navigator && !bre.wake) bre.wake = await navigator.wakeLock.request('screen');
    if(!on && bre.wake){ await bre.wake.release(); bre.wake = null; }
  }catch(e){ bre.wake = null; }
}

function breStart(){
  const now = performance.now();
  if(!bre.started){
    bre.started = true; bre.i = 0; bre.phaseStart = now; bre.elapsed = 0; bre.lastCount = null;
    // Begin the first breath in from wherever the flower is resting.
    bre.phaseStart -= Math.acos(1 - 2 * Math.min(0.99, bre.p)) / Math.PI * BREATH_PATTERNS[bre.pattern][0].d * 1000;
  } else {
    bre.phaseStart = now - bre.pausedAt;
  }
  bre.running = true; bre.runStart = now;
  breShowPhase(); breTexts(); breWake(true);
  requestAnimationFrame(breFrame);
}

function brePause(){
  if(!bre.running) return;
  const now = performance.now();
  bre.running = false;
  bre.pausedAt = now - bre.phaseStart;
  bre.elapsed += now - bre.runStart;
  breTexts(); breWake(false);
}

function breReset(){
  brePause();
  bre.started = false; bre.i = 0; bre.elapsed = 0; bre.lastSec = -1;
  document.getElementById('breTime').textContent = breDigits('0:00');
  breTexts();
}

function breSetPattern(k){
  const wasRunning = bre.running;
  breReset();
  bre.pattern = k;
  breTexts();
  if(wasRunning) breStart();
}

function openBreath(){
  bre.from = document.activeElement;
  breView.hidden = false;
  document.body.style.overflow = 'hidden';
  if('vibrate' in navigator) document.getElementById('breVibWrap').hidden = false;
  breReset();
  drawFlower(0.2);
  history.pushState({ breath:true }, '');
  document.getElementById('breGo').focus();
}

function hideBreath(){
  if(breView.hidden) return;
  breReset();
  breView.hidden = true;
  document.body.style.overflow = '';
  if(bre.from && bre.from.focus) bre.from.focus();
}

document.getElementById('breOpen').onclick = openBreath;
document.getElementById('breGo').onclick = () => { if(bre.running) brePause(); else breStart(); };
document.getElementById('breClose').onclick = () => { if(history.state && history.state.breath) history.back(); else hideBreath(); };
window.addEventListener('popstate', hideBreath);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !breView.hidden) document.getElementById('breClose').click(); });
// Leaving the app pauses the exercise, so it does not race ahead in the background.
document.addEventListener('visibilitychange', () => { if(document.hidden) brePause(); });
drawFlower(0.2);

/* ------------------------------------------------------------
   Small helpers shared by the tools
   ------------------------------------------------------------ */

function uiLang(dict){ return dict[langEl.value] ? langEl.value : 'en'; }
function faDigits(s, L){ return L === 'fa' ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s); }
function mmss(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// Keeps the screen on while a tool is running (phones that support it).
async function wakeLock(owner, on){
  try{
    if(on && 'wakeLock' in navigator && !owner.wake && !document.hidden){
      owner.wake = await navigator.wakeLock.request('screen');
      owner.wake.addEventListener('release', () => { owner.wake = null; });
    }
    if(!on && owner.wake){ const w = owner.wake; owner.wake = null; await w.release(); }
  }catch(e){ owner.wake = null; }
}

// One shared sound engine. Phones only allow sound after a tap, so it is
// started from the Start buttons.
function getAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    if(!getAudio.ctx) getAudio.ctx = new AC();
    if(getAudio.ctx.state === 'suspended') getAudio.ctx.resume();
  }catch(e){ return null; }
  return getAudio.ctx;
}
function tone(ac, at, freq, dur, vol){
  try{
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(at); o.stop(at + dur + 0.03);
  }catch(e){}
}
function chime(){
  const ac = getAudio(); if(!ac) return;
  const t = ac.currentTime + 0.05;
  [660, 880, 1100].forEach((f, i) => tone(ac, t + i * 0.24, f, 0.55, 0.35));
}

/* ------------------------------------------------------------
   COOLING TIMER (burns) — 20 minutes under cool running water.
   It keeps running if the window is closed; the button in the
   Burns card then shows the time left.
   ------------------------------------------------------------ */

const COOL_MS = 20 * 60 * 1000;
const COOL_RING = 540.35;          // length of the ring in the dial (2 × π × 86)
const coolView = document.getElementById('coolView');
let cool = { running:false, endAt:0, left:COOL_MS, done:false, timer:null, wake:null, from:null };

function coolLeft(){ return cool.running ? Math.max(0, cool.endAt - Date.now()) : cool.left; }

function coolTexts(){
  const ui = COOL_UI[uiLang(COOL_UI)];
  document.getElementById('coolTitle').textContent = ui.title;
  document.getElementById('coolClose').setAttribute('aria-label', ui.close);
  document.getElementById('coolLeft').textContent = ui.left;
  document.getElementById('coolReset').textContent = ui.reset;
  document.getElementById('coolTips').innerHTML = ui.tips.map(t => `<li>${t}</li>`).join('');
}

function coolRender(){
  const L = uiLang(COOL_UI), ui = COOL_UI[L], ms = coolLeft(), started = ms < COOL_MS;
  if(!coolView.hidden){
    document.getElementById('coolTime').textContent = faDigits(mmss(ms), L);
    document.getElementById('coolRing').style.strokeDashoffset = (COOL_RING * (1 - ms / COOL_MS)).toFixed(1);
    document.getElementById('coolMsg').textContent = cool.done ? ui.done : cool.running ? ui.running : started ? ui.paused : ui.ready;
    document.getElementById('coolGo').textContent = cool.done ? ui.again : cool.running ? ui.pause : started ? ui.resume : ui.go;
    document.getElementById('coolReset').hidden = !started || cool.done;
    coolView.classList.toggle('run', cool.running);
  }
  document.querySelectorAll('[data-open="cool"]').forEach(b => {
    const t = b.querySelector('b'), s = b.querySelector('small');
    if(cool.done){ t.textContent = ui.btnDone; s.textContent = ui.btnDoneSub; }
    else if(started){ t.textContent = ui.btnRun.replace('{t}', faDigits(mmss(ms), L)); s.textContent = ui.btnRunSub; }
    else { t.textContent = ui.btn; s.textContent = ui.btnSub; }
  });
}

function coolStart(){
  if(cool.done){ cool.done = false; cool.left = COOL_MS; }
  getAudio();                                // allow the end-of-timer sound
  cool.running = true;
  cool.endAt = Date.now() + cool.left;
  clearInterval(cool.timer);
  cool.timer = setInterval(coolTick, 250);
  wakeLock(cool, true);
  coolRender();
}
function coolPause(){
  if(!cool.running) return;
  cool.left = coolLeft();
  cool.running = false;
  clearInterval(cool.timer);
  wakeLock(cool, false);
  coolRender();
}
function coolReset(){
  coolPause();
  cool.left = COOL_MS; cool.done = false;
  coolRender();
}
function coolTick(){
  if(cool.running && coolLeft() <= 0){ coolFinish(); return; }
  coolRender();
}
function coolFinish(){
  cool.running = false; cool.done = true; cool.left = 0;
  clearInterval(cool.timer);
  wakeLock(cool, false);
  chime();
  if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  if(coolView.hidden && !document.hidden) openCool();
  coolRender();
}

function openCool(){
  if(!coolView.hidden) return;
  cool.from = document.activeElement;
  coolView.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ cool:true }, '');
  coolTexts(); coolRender();
  document.getElementById('coolGo').focus();
}
function hideCool(){
  if(coolView.hidden) return;
  coolView.hidden = true;
  document.body.style.overflow = '';
  coolRender();
  if(cool.from && cool.from.focus) cool.from.focus();
}
document.getElementById('coolGo').onclick = () => { if(cool.running) coolPause(); else coolStart(); };
document.getElementById('coolReset').onclick = coolReset;
document.getElementById('coolClose').onclick = () => { if(history.state && history.state.cool) history.back(); else hideCool(); };


/* ------------------------------------------------------------
   CPR RHYTHM COACH — a beep 110 times a minute (the middle of
   100–120), with an optional 30 : 2 count for trained rescuers.
   ------------------------------------------------------------ */

const CPR_BEAT = 60 / 110;         // seconds between pushes
const CPR_BREATHS = 5;             // seconds allowed for 2 rescue breaths
const cprView = document.getElementById('cprView');
let cpr = { mode:'hands', running:false, started:false, next:0, n:0, phase:'', queue:[], timer:null,
            elapsed:0, runStart:0, lastSec:-1, swapAt:120, swapTimer:null, breathStart:0, wake:null, from:null };

function cprNow(){ return performance.now() / 1000; }

function cprBeep(t, freq, dur, vol){
  if(!document.getElementById('cprSound').checked) return;
  const ac = getAudio.ctx;
  if(!ac || ac.state !== 'running') return;
  tone(ac, ac.currentTime + Math.max(0, t - cprNow()), freq, dur, vol);
}

// Plans the next beats a moment ahead, so the sound stays exactly on time.
function cprPump(){
  const now = cprNow();
  if(cpr.next < now - 0.25) cpr.next = now + 0.05;     // coming back after a pause (e.g. after dialling): skip missed beats
  while(cpr.next < now + 0.12){
    if(cpr.mode === 'breaths' && cpr.n === 30){
      cpr.queue.push({ t:cpr.next, kind:'breaths' });
      cprBeep(cpr.next, 440, 0.3, 0.35);
      cprBeep(cpr.next + 2.4, 440, 0.3, 0.35);
      cpr.n = 0;
      cpr.next += CPR_BREATHS;
    } else {
      cpr.n = cpr.mode === 'breaths' ? cpr.n + 1 : (cpr.n % 30) + 1;
      cpr.queue.push({ t:cpr.next, kind:'push', n:cpr.n });
      cprBeep(cpr.next, (cpr.mode === 'breaths' && cpr.n === 1) ? 1320 : 990, 0.05, 0.5);
      cpr.next += CPR_BEAT;
    }
  }
}

function cprFrame(){
  if(!cpr.running) return;
  const now = cprNow(), L = uiLang(CPR_UI), ui = CPR_UI[L];
  const pulse = document.getElementById('cprPulse'), count = document.getElementById('cprCount');
  while(cpr.queue.length && cpr.queue[0].t <= now){
    const ev = cpr.queue.shift();
    if(ev.kind === 'push'){
      pulse.classList.remove('breath');
      pulse.classList.add('hit');
      setTimeout(() => pulse.classList.remove('hit'), 130);
      count.textContent = cpr.mode === 'breaths' ? faDigits(ev.n, L) : '';
      if(cpr.phase !== 'push'){ cpr.phase = 'push'; document.getElementById('cprMsg').textContent = ui.push; }
    } else {
      cpr.phase = 'breaths';
      cpr.breathStart = ev.t;
      pulse.classList.add('breath');
      document.getElementById('cprMsg').textContent = ui.breaths;
    }
  }
  if(cpr.phase === 'breaths') count.textContent = faDigits(now - cpr.breathStart < 2.4 ? 1 : 2, L);
  const sec = Math.floor(cpr.elapsed + now - cpr.runStart);
  if(sec !== cpr.lastSec){
    cpr.lastSec = sec;
    document.getElementById('cprTime').textContent = faDigits(mmss(sec * 1000), L);
    if(sec >= cpr.swapAt){ cpr.swapAt += 120; cprSwapNote(); }
  }
  requestAnimationFrame(cprFrame);
}

function cprSwapNote(){
  const el = document.getElementById('cprSwap');
  el.textContent = CPR_UI[uiLang(CPR_UI)].swap;
  el.hidden = false;
  clearTimeout(cpr.swapTimer);
  cpr.swapTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

function cprTexts(){
  const L = uiLang(CPR_UI), ui = CPR_UI[L];
  document.getElementById('cprTitle').textContent = ui.title;
  document.getElementById('cprClose').setAttribute('aria-label', ui.close);
  document.getElementById('cprCallLbl').textContent = ui.call;
  document.getElementById('cprSoundLbl').textContent = ui.sound;
  document.getElementById('cprInfo').textContent = ui.modes[cpr.mode].info;
  document.getElementById('cprGo').textContent = cpr.running ? ui.pause : (cpr.started ? ui.resume : ui.start);
  const box = document.getElementById('cprModes');
  box.innerHTML = Object.keys(ui.modes).map(k =>
    `<button type="button" role="radio" aria-checked="${k === cpr.mode}" data-mode="${k}">${ui.modes[k].label}</button>`).join('');
  box.querySelectorAll('button').forEach(b => { b.onclick = () => cprSetMode(b.dataset.mode); });
  if(!cpr.running){
    document.getElementById('cprMsg').textContent = ui.ready;
    document.getElementById('cprCount').textContent = '';
    document.getElementById('cprPulse').classList.remove('breath');
  }
}

function cprStart(){
  getAudio();                                // sound needs a tap to start
  const now = cprNow();
  if(!cpr.started){ cpr.started = true; cpr.elapsed = 0; cpr.swapAt = 120; cpr.lastSec = -1; }
  cpr.n = 0; cpr.phase = ''; cpr.queue = [];
  cpr.next = now + 0.3;
  cpr.running = true; cpr.runStart = now;
  clearInterval(cpr.timer);
  cpr.timer = setInterval(cprPump, 25);
  cprPump();
  wakeLock(cpr, true);
  cprTexts();
  requestAnimationFrame(cprFrame);
}
function cprPause(){
  if(!cpr.running) return;
  cpr.running = false;
  cpr.elapsed += cprNow() - cpr.runStart;
  clearInterval(cpr.timer);
  cpr.queue = [];
  wakeLock(cpr, false);
  cprTexts();
}
function cprSetMode(k){
  cpr.mode = k;
  if(cpr.running){ cpr.n = 0; cpr.phase = ''; cpr.queue = []; cpr.next = cprNow() + 0.3; }
  cprTexts();
}

function openCpr(){
  if(!cprView.hidden) return;
  cpr.from = document.activeElement;
  cprView.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ cpr:true }, '');
  cpr.started = false; cpr.elapsed = 0; cpr.lastSec = -1;
  document.getElementById('cprTime').textContent = faDigits('0:00', uiLang(CPR_UI));
  document.getElementById('cprSwap').hidden = true;
  cprTexts();
  document.getElementById('cprGo').focus();
}
function hideCpr(){
  if(cprView.hidden) return;
  cprPause();
  cprView.hidden = true;
  document.body.style.overflow = '';
  if(cpr.from && cpr.from.focus) cpr.from.focus();
}
document.getElementById('cprGo').onclick = () => { if(cpr.running) cprPause(); else cprStart(); };
document.getElementById('cprClose').onclick = () => { if(history.state && history.state.cpr) history.back(); else hideCpr(); };
