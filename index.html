}

const TRANSLIT = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m',
  'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y',
  'ь':'','э':'e','ю':'yu','я':'ya' };
function translit(s){
  // "е" sounds like "ye" at the start of a word and after a vowel (Есть → Yest).
  return String(s).replace(/[а-яё]/gi, (ch, i, all) => {
    const lo = ch.toLowerCase();
    let t = TRANSLIT[lo];
    if(lo === 'е' && (i === 0 || /[^а-яё]|[аеёиоуыэюяъь]/i.test(all[i - 1]))) t = 'ye';
    return ch === lo ? t : t.charAt(0).toUpperCase() + t.slice(1);
  });
}

function sayMessage(){
  const parts = SAY_SITS.filter(k => say.sits.includes(k)).map(k => SAY_RU[k]);
  const other = say.other.trim().replace(/[.\s]+$/, '');
  const addr = say.place === 'main' ? 'улица Островитянова, дом 1, главный корпус университета имени Пирогова'
             : say.place === 'dorm' ? 'улица Академика Волгина, дом ' + say.dorm + ', общежитие университета имени Пирогова'
             : (other || '…');
  parts.push('Адрес: ' + addr + '.');
  if(say.floor.trim()) parts.push('Этаж ' + say.floor.trim() + '.');
  if(say.room.trim()) parts.push((say.place === 'main' ? 'Кабинет ' : 'Комната ') + say.room.trim() + '.');
  return parts.join(' ');
}

function sayRussianVoice(){
  if(!('speechSynthesis' in window)) return null;
  const ru = speechSynthesis.getVoices().filter(v => /^ru([-_]|$)/i.test(v.lang));
  return ru.find(v => v.localService) || ru[0] || null;   // prefer a voice that works offline
}
function sayVoiceCheck(){
  const apply = () => {
    const ok = !!sayRussianVoice();
    sayView.querySelectorAll('[data-speak]').forEach(b => { b.hidden = !ok; });
    const note = document.getElementById('sayNoVoice');
    if(note) note.hidden = ok;
  };
  if(!('speechSynthesis' in window) || speechSynthesis.getVoices().length){ apply(); return; }
  speechSynthesis.onvoiceschanged = apply;   // some browsers load their voices a moment later
  setTimeout(apply, 1500);
}
function saySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 0.85;
  const v = sayRussianVoice();
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

const SPEAK_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg>';

function sayBuild(){
  const L = uiLang(SAY_UI), ui = SAY_UI[L], showTr = L !== 'ru';
  document.getElementById('sayTitle').textContent = ui.title;
  document.getElementById('sayClose').setAttribute('aria-label', ui.close);
  document.getElementById('sayBigHint').textContent = ui.bigHint;
  document.getElementById('sayInner').innerHTML = `
    ${ui.english ? `<p class="sayEn">${ui.english}</p>` : ''}
    <h3>${ui.what}</h3>
    <div class="sayChips">${SAY_SITS.map(k =>
      `<button type="button" class="sayChip" data-sit="${k}" aria-pressed="${say.sits.includes(k)}">${ui.sits[k]}</button>`).join('')}</div>
    <h3>${ui.where}</h3>
    <div class="sayOpts" role="radiogroup" aria-label="${ui.where}">
      <button type="button" class="sayOpt" role="radio" data-place="main" aria-checked="${say.place === 'main'}">${ui.main}</button>
      <button type="button" class="sayOpt" role="radio" data-place="dorm" aria-checked="${say.place === 'dorm'}">${ui.dorm}</button>
      <div class="sayHouses" id="sayHouses" role="radiogroup" aria-label="${ui.house}">${SAY_DORMS.map(n =>
        `<button type="button" role="radio" data-dorm="${n}" aria-checked="${say.dorm === n}">${faDigits(n, L)}</button>`).join('')}</div>
      <button type="button" class="sayOpt" role="radio" data-place="other" aria-checked="${say.place === 'other'}">${ui.other}</button>
      <input class="sayOther" id="sayOther" type="text" maxlength="120" autocomplete="street-address" placeholder="${ui.otherPh}" aria-label="${ui.other}">
    </div>
    <div class="sayRow">
      <label>${ui.floor}<input id="sayFloor" type="text" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label>${ui.room}<input id="sayRoom" type="text" maxlength="8" autocomplete="off"></label>
    </div>
    <div class="sayOut">
      <p class="sayLbl">${ui.say}</p>
      <p class="sayRu" id="sayRu" lang="ru" dir="ltr"></p>
      ${showTr ? '<p class="sayTr" id="sayTr" dir="ltr"></p>' : ''}
      <div class="sayBtns">
        <button type="button" id="sayPlay" data-speak="msg">${SPEAK_ICON}<span>${ui.play}</span></button>
        <button type="button" id="sayBigBtn">${ui.big}</button>
        <a href="tel:112">${ui.call}</a>
      </div>
      <p class="sayNoVoice" id="sayNoVoice" hidden>${ui.noVoice}</p>
    </div>
    <h3>${ui.phrases}</h3>
    <div>${SAY_PHRASES.map((p, i) => `
      <div class="sayPh">
        <div class="sayPhTxt"><span class="ru" lang="ru" dir="ltr">${p.ru}</span>${showTr ?
          `<span class="tr" dir="ltr">${translit(p.ru)}</span><span class="mean">${p[L] || p.en}</span>` : ''}</div>
        <button type="button" class="sayPlay" data-speak="${i}" aria-label="${ui.play}">${SPEAK_ICON}</button>
      </div>`).join('')}</div>`;
  document.getElementById('sayOther').value = say.other;
  document.getElementById('sayFloor').value = say.floor;
  document.getElementById('sayRoom').value = say.room;
  sayUpdate();
  sayVoiceCheck();
}

function sayUpdate(){
  const msg = sayMessage();
  document.getElementById('sayRu').textContent = msg;
  const tr = document.getElementById('sayTr');
  if(tr) tr.textContent = translit(msg);
  document.getElementById('sayHouses').hidden = say.place !== 'dorm';
  document.getElementById('sayOther').hidden = say.place !== 'other';
  sayView.querySelectorAll('[data-place]').forEach(b => b.setAttribute('aria-checked', b.dataset.place === say.place));
  sayView.querySelectorAll('[data-dorm]').forEach(b => b.setAttribute('aria-checked', b.dataset.dorm === say.dorm));
  sayView.querySelectorAll('[data-sit]').forEach(b => b.setAttribute('aria-pressed', say.sits.includes(b.dataset.sit)));
}

document.getElementById('sayInner').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.sit){
    const k = b.dataset.sit;
    say.sits = say.sits.includes(k) ? say.sits.filter(x => x !== k) : say.sits.concat(k);
  } else if(b.dataset.place){
    say.place = b.dataset.place; saySave();
    if(say.place === 'other') setTimeout(() => document.getElementById('sayOther').focus(), 0);
  } else if(b.dataset.dorm){
    say.dorm = b.dataset.dorm; saySave();
  } else if(b.dataset.speak !== undefined){
    saySpeak(b.dataset.speak === 'msg' ? sayMessage() : SAY_PHRASES[+b.dataset.speak].ru);
    return;
  } else if(b.id === 'sayBigBtn'){
    document.getElementById('sayBigText').textContent = sayMessage();
    document.getElementById('sayBig').hidden = false;
    return;
  } else return;
  sayUpdate();
});
document.getElementById('sayInner').addEventListener('input', e => {
  const map = { sayOther:'other', sayFloor:'floor', sayRoom:'room' };
  const k = map[e.target.id];
  if(!k) return;
  say[k] = e.target.value.slice(0, 120);
  saySave();
  sayUpdate();
});
document.getElementById('sayBig').onclick = () => { document.getElementById('sayBig').hidden = true; };

function openSay(){
  if(!sayView.hidden) return;
  say.from = document.activeElement;
  sayView.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ say:true }, '');
  sayBuild();
  document.getElementById('sayClose').focus();
}
function hideSay(){
  if(sayView.hidden) return;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('sayBig').hidden = true;
  sayView.hidden = true;
  document.body.style.overflow = '';
  if(say.from && say.from.focus) say.from.focus();
}
document.getElementById('sayClose').onclick = () => { if(history.state && history.state.say) history.back(); else hideSay(); };


/* The phone's back button closes whichever tool is open; Escape does too. */
window.addEventListener('popstate', () => { hideCool(); hideCpr(); hideSay(); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const big = document.getElementById('sayBig');
  if(!big.hidden){ big.hidden = true; return; }
  if(!coolView.hidden) document.getElementById('coolClose').click();
  else if(!cprView.hidden) document.getElementById('cprClose').click();
  else if(!sayView.hidden) document.getElementById('sayClose').click();
});
// Phones drop the "keep the screen on" lock when you switch apps; take it back.
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(cool.running){ wakeLock(cool, true); coolTick(); }
  if(cpr.running) wakeLock(cpr, true);
});


window.floorMapsReady = true;
renderFloorMaps(langEl.value);

SURVEYS.forEach((sv, i) => { document.getElementById('quizLaunchBtn' + i).onclick = () => openQuiz(i); });

// Everything above is defined by now, so it is safe to fill the quiz card.
renderQuizLaunch();

// …and the first aid cards, quick links and tools. A link such as
// …/#aid-burns (for a QR code on a poster) opens that card straight away.
window.aidReady = true;
renderExtras(langEl.value);
if(location.hash) goTo(decodeURIComponent(location.hash.slice(1)), false);
</script>
