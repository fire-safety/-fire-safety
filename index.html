<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Safety for International Students — RNIMU</title>
<meta name="theme-color" content="#00843D">

<!-- This line connects the app to manifest.json, which is what lets a phone
     install it to the home screen. Without it, it is just a website. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* ============================================================
   COLOURS AND SIZES
   These are the safety colours used on real evacuation signs.
   Green means "this way out". Red means "never do this".
   Keep that meaning — do not use red for decoration.
   ============================================================ */
:root{
  --green:#00843D;        /* safety green — escape routes */
  --green-dark:#00632E;
  --red:#C8102E;          /* safety red — prohibitions only */
  --ink:#14261C;          /* text */
  --muted:#5A6B5F;        /* secondary text */
  --paper:#FFFFFF;
  --wash:#EFF4F0;         /* section background */
  --line:#CBD8CE;         /* hairlines */
  --radius:10px;
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  /* No downloaded fonts on purpose: the app must work with no internet,
     and a font that fails to load is a font you cannot read. */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  color:var(--ink);
  background:var(--wash);
}

.page{max-width:520px;margin:0 auto;background:var(--paper);min-height:100vh}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.bar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.bar .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}

select{
  font:inherit;font-size:15px;padding:7px 10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);
}

/* ---------- emergency block ---------- */
/* This sits at the very top because it is the one thing someone needs
   to find in three seconds without reading anything else. */
.emergency{background:var(--green);color:#fff;padding:20px 18px 22px}
.emergency h2{margin:0 0 4px;font-size:15px;font-weight:600}
.emergency p{margin:0 0 14px;font-size:14px;opacity:.9}

.call{
  display:flex;align-items:baseline;gap:12px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  border-radius:var(--radius);
  padding:13px 16px;margin-bottom:8px;
  color:#fff;text-decoration:none;
}
.call:last-child{margin-bottom:0}
.call .num{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.call .who{font-size:14px;opacity:.92}
.call:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- sections ---------- */
.list{padding:8px 0 40px}

details{border-bottom:1px solid var(--line)}
summary{
  padding:16px 18px;cursor:pointer;font-weight:600;font-size:16px;
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400;font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:"\2013"}
summary:focus-visible{outline:3px solid var(--green);outline-offset:-3px}

.body{padding:0 18px 18px}
.body p{margin:0 0 12px}
.body ol,.body ul{margin:0 0 12px;padding-inline-start:22px}
.body li{margin-bottom:7px}
.body strong{font-weight:600}

/* A red rule marks a prohibition. Same meaning as a red sign on a wall. */
.never{
  border-inline-start:4px solid var(--red);
  background:#FCF2F3;
  padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0;
  margin:0 0 12px;
}
.never b{color:var(--red)}

.note{font-size:14px;color:var(--muted)}

/* ---------- footer ---------- */
footer{padding:22px 18px 40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer p{margin:0 0 8px}

#offline{
  display:none;background:var(--ink);color:#fff;
  padding:9px 18px;font-size:14px;text-align:center;
}
body.is-offline #offline{display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- quiz launch ---------- */
.quizLaunch{
  display:block;width:calc(100% - 36px);margin:16px 18px;
  background:var(--green);color:#fff;border:none;border-radius:var(--radius);
  padding:14px 16px;font:inherit;font-size:15px;font-weight:600;
  text-align:start;cursor:pointer;
}
.quizLaunch + .quizLaunch{margin-top:-6px}
.quizLaunch:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}
.quizLaunch .sub{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}

/* ---------- quiz flow ---------- */
#quizView{padding:0 0 40px}
.qTop{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.qBack{background:none;border:none;font:inherit;font-size:15px;color:var(--green-dark);cursor:pointer;padding:4px 0;font-weight:600}
.qDots{display:flex;gap:6px;margin-inline-start:auto}
.qDot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.qDot.on{background:var(--green)}

.qBody{padding:18px}
.qSectionTitle{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.qQuestion{margin:0 0 22px}
.qText{font-size:16px;font-weight:600;margin:0 0 12px;line-height:1.4}

.qOption{
  display:block;width:100%;text-align:start;
  padding:12px 14px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
}
.qOption.sel{border-color:var(--green);background:#EAF5EF;font-weight:600}
.qOption:focus-visible{outline:3px solid var(--green);outline-offset:1px}

.qInput{
  width:100%;padding:12px 14px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);
}

.qScale{display:flex;gap:8px;margin-bottom:6px}
.qScaleBtn{
  flex:1;padding:12px 0;text-align:center;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);font:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
}
.qScaleBtn.sel{border-color:var(--green);background:var(--green);color:#fff}
.qScaleLabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px}

.qErr{color:var(--red);font-size:13px;margin:4px 0 0}
.qIntro{font-size:15px;margin:0 0 20px}
.qKicker{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin:0 0 4px}
.qHelp{font-size:13px;color:var(--muted);margin:-8px 0 12px}
textarea.qInput{min-height:84px;resize:vertical;display:block}
.qCheck{position:relative;padding-inline-start:44px}
.qCheck::before{content:"";position:absolute;inset-inline-start:14px;top:50%;width:18px;height:18px;margin-top:-9px;border:2px solid var(--line);border-radius:4px;background:var(--paper)}
.qCheck.sel::before{content:"\2713";border-color:var(--green);background:var(--green);color:#fff;font-size:13px;line-height:18px;text-align:center}
.qScaleBtn{min-width:0}
.qScale.wide{gap:4px}
.qScale.wide .qScaleBtn{font-size:14px;padding:11px 0}
.qGridRow{margin:0 0 14px}
.qGridLabel{font-size:15px;margin:0 0 6px}
.qGridBtns{display:flex;gap:6px}
.qGridBtn{flex:1;min-width:0;padding:10px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.qGridBtn.na{flex:2.2;font-size:12px;font-weight:500;line-height:1.2;padding:6px 4px}
.qGridBtn.sel{border-color:var(--green);background:var(--green);color:#fff}
.qGridBtn:focus-visible,.qScaleBtn:focus-visible{outline:3px solid var(--green-dark);outline-offset:1px}
.qRank{font-size:20px;font-weight:700;margin:2px 0 18px}
.qReview{text-align:start;margin:24px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--wash)}
.qReview p{margin:0 0 10px;font-size:14px}
.qReview p:last-child{margin-bottom:0}
.qReviewTitle{font-weight:600;font-size:15px!important}

.qNav{display:flex;gap:10px;padding:6px 18px 18px}
.qBtn{
  flex:1;padding:13px 16px;border-radius:var(--radius);font:inherit;font-size:15px;font-weight:600;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
}
.qBtn.primary{background:var(--green);border-color:var(--green);color:#fff}
.qBtn:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}

/* ---------- videos ---------- */
.videos{padding:18px 18px 6px;border-bottom:1px solid var(--line)}
.videos h2{font-size:17px;font-weight:600;margin:0 0 2px}
.videos .vSub{font-size:14px;color:var(--muted);margin:0 0 12px}
.vGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vCard{margin:0 0 12px}
.vCard video{display:block;width:100%;aspect-ratio:9/16;background:#000;border-radius:var(--radius);object-fit:cover}
.vCard figcaption{font-size:14px;font-weight:600;margin-top:6px;line-height:1.3}
.qDone{padding:40px 22px;text-align:center}

/* ---------- floor plans ---------- */
.floorMaps{margin:0 0 12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mapRow{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
  background:var(--paper);border:none;border-bottom:1px solid var(--line);
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);text-align:start;cursor:pointer;
}
.mapRow:last-child{border-bottom:none}
.mapRow:focus-visible{outline:3px solid var(--green);outline-offset:-3px}
.mapNum{flex:none;width:38px;height:38px;border-radius:8px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.mapName{flex:1}
.mapThumb{flex:none;width:130px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--wash)}
#mapView{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#EEF2EF}
#mapView[hidden]{display:none}
.mapBar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;background:var(--green);color:#fff;font-weight:600}
.mapBar span{flex:1}
.mapBar button{background:none;border:none;color:#fff;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.mapScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;position:relative;background:#fff}
.mapScroll img{display:block;max-width:none;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mapLoading{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.mapZoom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.mapZoom button{width:48px;height:48px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:26px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.mapZoom button:focus-visible,.mapBar button:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}
.qDone .score{font-size:40px;font-weight:700;color:var(--green-dark);margin:0 0 6px}
</style>
</head>

<body>
<div class="page">

  <div class="bar">
    <h1><span id="appTitle">Fire Safety for International Students</span>
      <span class="sub" id="buildingLabel">RNIMU — Ostrovityanova 1</span>
    </h1>
    <!-- Add a new <option> here when you add a language below. -->
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="fa">فارسی</option>
    </select>
  </div>

  <div id="offline">Offline — everything here still works.</div>

  <section class="emergency">
    <h2 id="emTitle"></h2>
    <p id="emSub"></p>
    <a class="call" href="tel:112"><span class="num">112</span><span class="who" id="who112"></span></a>
    <a class="call" href="tel:101"><span class="num">101</span><span class="who" id="who101"></span></a>
    <a class="call" href="tel:+74954345192"><span class="num">+7 495 434-51-92</span><span class="who" id="whoDuty"></span></a>
  </section>

  <!-- One button per questionnaire level (SURVEYS in the script, in this order). -->
  <button class="quizLaunch" id="quizLaunchBtn0" type="button">
    <span id="quizLaunchTitle0"></span>
    <span class="sub" id="quizLaunchSub0"></span>
  </button>
  <button class="quizLaunch" id="quizLaunchBtn1" type="button">
    <span id="quizLaunchTitle1"></span>
    <span class="sub" id="quizLaunchSub1"></span>
  </button>

  <div id="infoView">
    <!-- VIDEOS: to add one, put the .mp4 (and a .jpg preview) in the videos
         folder, then add a <figure> below and its title in CONTENT (vid1, vid2…). -->
    <section class="videos">
      <h2 id="vidTitle"></h2>
      <p class="vSub" id="vidSub"></p>
      <div class="vGrid">
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-university.jpg" src="evacuation-university.mp4"></video>
          <figcaption id="vid1"></figcaption>
        </figure>
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-dormitory.jpg" src="evacuation-dormitory.mp4"></video>
          <figcaption id="vid2"></figcaption>
        </figure>
        <figure class="vCard">
          <video controls playsinline preload="none" poster="evacuation-smoke.jpg" src="evacuation-smoke.mp4"></video>
          <figcaption id="vid3"></figcaption>
        </figure>
      </div>
    </section>
    <div class="list" id="list"></div>
    <footer id="foot"></footer>
  </div>

  <div id="quizView" hidden></div>
</div>

<!-- Full-screen floor plan viewer (filled in by the FLOOR PLANS script below). -->
<div id="mapView" hidden role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <div class="mapBar">
    <span id="mapTitle"></span>
    <button type="button" id="mapClose" aria-label="Close">✕</button>
  </div>
  <div class="mapScroll" id="mapScroll">
    <p class="mapLoading" id="mapLoading"></p>
    <img id="mapImg" alt="">
  </div>
  <div class="mapZoom">
    <button type="button" id="mapOut" aria-label="Zoom out">−</button>
    <button type="button" id="mapIn" aria-label="Zoom in">+</button>
  </div>
</div>

<script>
/* ============================================================
   THE ONLY PART YOU NEED TO EDIT

   Everything the app says lives in CONTENT below.
   To add a language, copy a whole block (for example the "en" block),
   paste it, change the two-letter code, translate the text,
   and add a matching <option> to the language menu above.

   Do not delete the commas or the curly brackets.
   ============================================================ */

const CONTENT = {

  en: {
    appTitle: "Fire Safety for International Students",
    vidTitle: "Watch: how to evacuate",
    vidSub: "Our team shows the real evacuation routes. Needs internet.",
    vid1: "From the university building",
    vid2: "From the dormitory",
    vid3: "If there is smoke in the dormitory",
    emTitle: "In an emergency, call",
    emSub: "Free from any phone, including with no SIM card.",
    who112: "All emergencies",
    who101: "Fire service",
    whoDuty: "RNIMU duty dispatcher",
    sections: [

      { title: "The alarm sounds",
        html: `
          <ol>
            <li>Leave straight away. Do not wait to be told a second time, and do not wait to see fire or smoke.</li>
            <li>Take your coat if it is next to you. Never go back for anything.</li>
            <li>Use the stairs. Close doors behind you.</li>
            <li>Go to the assembly point and stay there until you are told you may leave.</li>
          </ol>
          <div class="never"><b>Never use the lift.</b> It can stop at the fire floor or lose power with you inside.</div>
          <p class="note">RNIMU instruction: the building should be clear within 5–7 minutes, and you should move 20–25 metres away from it.</p>`
      },

      { title: "You see a fire",
        html: `
          <ol>
            <li>Warn the people around you and set off the nearest alarm.</li>
            <li>Call 112 or 101. Say the address, the building, and the floor.</li>
            <li>Leave. Close the door of the room behind you.</li>
          </ol>
          <p>Only consider an extinguisher if the fire is small, you have been trained, other people already know, and there is a clear way out behind you. If any of those is missing, leave.</p>`
      },

      { title: "Smoke in the corridor",
        html: `
          <p>Smoke kills far more people than flames. It rises, so the cleanest air is low down.</p>
          <ol>
            <li>Stay low and move towards the nearest safe exit.</li>
            <li>If the smoke is thick, do not push through it. Use another route.</li>
            <li>If no route is safe, go back to a room and close the door.</li>
          </ol>`
      },

      { title: "You cannot get out",
        html: `
          <ol>
            <li>Stay in the room and close the door.</li>
            <li>Block the gap under the door with clothing or towels.</li>
            <li>Call 112 and say exactly which building, floor and room you are in.</li>
            <li>Go to the window and make yourself visible.</li>
          </ol>
          <div class="never"><b>Do not open windows wide</b> if smoke is coming in from outside. Air movement can pull fire towards you.</div>`
      },

      { title: "Clothing catches fire",
        html: `
          <p><strong>Stop. Drop. Roll.</strong></p>
          <ol>
            <li>Stop moving — running feeds the flames.</li>
            <li>Drop to the ground.</li>
            <li>Cover your face with your hands and roll until the fire is out.</li>
          </ol>
          <p>To help someone else, smother the flames with a coat or blanket, then cool the burn with cool running water for 20 minutes.</p>`
      },

      { title: "Using an extinguisher",
        html: `
          <ol>
            <li>Pull the pin.</li>
            <li>Aim at the <strong>base</strong> of the fire, not at the flames.</li>
            <li>Squeeze the handle.</li>
            <li>Sweep side to side.</li>
          </ol>
          <p>Keep your back to the exit so you can always leave. If the fire does not go out within seconds, leave.</p>`
      },

      { title: "Your building: floor plans",
        html: `
          <p>Floor plans of the main building at Ostrovityanova 1. Tap a floor to open it, then pinch or use + / − to zoom.</p>
          <div class="floorMaps" id="floorMaps"></div>
          <p class="note">These plans show departments and room numbers. In an emergency, follow the official evacuation plan (план эвакуации) posted in the corridor on every floor.</p>`
      },

      { title: "Not allowed in the dormitory",
        html: `
          <div class="never"><b>Banned in rooms:</b> microwave ovens, hotplates, washing machines, oil heaters, charging e-bikes and scooters.</div>
          <p>Allowed, one each: kettle, iron, fridge. A heater up to 1100 W. Computer equipment up to 700 W total.</p>
          <p>Never block a corridor or prop a self-closing door open. That door is what keeps smoke out of the stairs.</p>`
      }

    ],
    foot: `<p>Prepared by students of RNIMU. Check every instruction against the official notices in your building.</p>
           <p>Last updated: September 2026.</p>`
  },

  ru: {
    appTitle: "Пожарная безопасность для иностранных студентов",
    vidTitle: "Видео: как эвакуироваться",
    vidSub: "Наша команда показывает настоящие пути эвакуации. Нужен интернет.",
    vid1: "Из учебного корпуса",
    vid2: "Из общежития",
    vid3: "Если в общежитии дым",
    emTitle: "При пожаре звоните",
    emSub: "Бесплатно с любого телефона, даже без SIM-карты.",
    who112: "Единая служба",
    who101: "Пожарная охрана",
    whoDuty: "Дежурный диспетчер РНИМУ",
    sections: [
      { title: "Сработала сигнализация",
        html: `
          <ol>
            <li>Выходите сразу. Не ждите повторного сигнала и не ждите, пока увидите огонь или дым.</li>
            <li>Возьмите верхнюю одежду, если она рядом. Никогда не возвращайтесь за вещами.</li>
            <li>Идите по лестнице. Закрывайте за собой двери.</li>
            <li>Идите на сборный пункт и оставайтесь там до разрешения.</li>
          </ol>
          <div class="never"><b>Лифтом пользоваться запрещено.</b> Он может остановиться на горящем этаже или обесточиться.</div>
          <p class="note">Инструкция РНИМУ: эвакуация — не более 5–7 минут, отойти от здания на 20–25 метров.</p>`
      },
      { title: "Вы увидели пожар",
        html: `
          <ol>
            <li>Предупредите людей рядом и включите ближайший извещатель.</li>
            <li>Позвоните 112 или 101. Назовите адрес, корпус и этаж.</li>
            <li>Выходите. Закройте дверь помещения за собой.</li>
          </ol>
          <p>Браться за огнетушитель можно, только если очаг маленький, вы умеете им пользоваться, другие уже предупреждены и позади вас свободный выход. Нет хотя бы одного — уходите.</p>`
      },
      { title: "Дым в коридоре",
        html: `
          <p>Дым опаснее огня. Он поднимается вверх, поэтому чистый воздух — внизу.</p>
          <ol>
            <li>Пригнитесь и двигайтесь к ближайшему безопасному выходу.</li>
            <li>Не идите сквозь плотный дым. Ищите другой путь.</li>
            <li>Если безопасного пути нет — вернитесь в помещение и закройте дверь.</li>
          </ol>`
      },
      { title: "Выйти невозможно",
        html: `
          <ol>

const listEl = document.getElementById('list');
const langEl = document.getElementById('lang');

function render(code){
  const c = CONTENT[code];
  if(!c) return;

  document.documentElement.lang = code;
  // Persian and Arabic read right to left.
  document.documentElement.dir = (code === 'fa' || code === 'ar') ? 'rtl' : 'ltr';

  document.getElementById('appTitle').textContent = c.appTitle;
  document.title = c.appTitle + ' — RNIMU';
  ['vidTitle','vidSub','vid1','vid2','vid3'].forEach(id => {
    document.getElementById(id).textContent = c[id] || CONTENT.en[id];
  });
  document.getElementById('emTitle').textContent = c.emTitle;
  document.getElementById('emSub').textContent   = c.emSub;
  document.getElementById('who112').textContent  = c.who112;
  document.getElementById('who101').textContent  = c.who101;
  document.getElementById('whoDuty').textContent = c.whoDuty;
  document.getElementById('foot').innerHTML      = c.foot;

  listEl.innerHTML = c.sections.map(s => `
    <details>
      <summary>${s.title}</summary>
      <div class="body">${s.html}</div>
    </details>`).join('');
  // Floor plans are filled in by the FLOOR PLANS script further down, once it has loaded.
  if(window.floorMapsReady) renderFloorMaps(code);

  try{ localStorage.setItem('lang', code); }catch(e){}
}

// Remember the chosen language, or guess from the phone's settings.
let start = 'en';
try{ start = localStorage.getItem('lang') || (navigator.language || 'en').slice(0,2); }catch(e){}
if(!CONTENT[start]) start = 'en';
langEl.value = start;
render(start);
// NOTE: the quiz card is filled in at the very bottom of this script instead
// of here. SURVEY is defined further down, and a const cannot be read before
// the line that defines it has run — doing it here threw an error that stopped
// the whole script, which killed the quiz AND the language switcher.

langEl.addEventListener('change', e => {
  render(e.target.value);
  renderQuizLaunch();
  if(!document.getElementById('quizView').hidden) renderQuizSection();
});

// Tell the user when they are offline, so they trust that it still works.
function netStatus(){ document.body.classList.toggle('is-offline', !navigator.onLine); }
window.addEventListener('online', netStatus);
window.addEventListener('offline', netStatus);
netStatus();

// This starts the service worker, which is what saves the app for offline use.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}

const SURVEYS = [SURVEY_L1, SURVEY_L2];
let SURVEY = SURVEY_L2;   // whichever level is open right now

let quizState = { section:0, answers:{}, order:{}, done:false };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// "A. 1 — Not at all confident" -> "1" (in Persian digits for fa)
function scaleNum(v, L){
  const n = (String(v).match(/\d+/) || [String(v)])[0];
  return L === 'fa' ? n.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : n;
}

function allQuestions(){
  return SURVEY.sections.reduce((all, s) => all.concat(s.questions), []);
}

function renderQuizLaunch(){
  SURVEYS.forEach((sv, i) => {
    const L = sv.launch[langEl.value] ? langEl.value : 'en';
    document.getElementById('quizLaunchTitle' + i).textContent = sv.launch[L].title;
    document.getElementById('quizLaunchSub' + i).textContent = sv.launch[L].sub;
  });
}

function openQuiz(level){
  SURVEY = SURVEYS[level];
  quizState = { section:0, answers:{}, order:{}, done:false };
  // Shuffle the options of scored questions once per attempt.
  allQuestions().forEach(q => {
    if(q.correct && q.shuffle !== false){
      const idx = q.options.map((o,i) => i);
      for(let i = idx.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
      quizState.order[q.id] = idx;
    }
  });
  document.getElementById('infoView').hidden = true;
  document.getElementById('quizView').hidden = false;
  window.scrollTo(0, 0);
  renderQuizSection();
}

function closeQuiz(){
  document.getElementById('quizView').hidden = true;
  document.getElementById('infoView').hidden = false;
}

function isAnswered(q){
  const v = quizState.answers[q.id];
  if(q.type === 'checkbox') return Array.isArray(v) && v.length > 0;
  if(q.type === 'grid') return !!v && q.rows.every((r,i) => v[i] !== undefined);
  return v !== undefined && String(v).trim() !== '';
}

function renderQuizSection(){
  const L = SURVEY.ui[langEl.value] ? langEl.value : 'en';
  const ui = SURVEY.ui[L];
  const view = document.getElementById('quizView');

  if(quizState.done){
    const scored = allQuestions().filter(q => q.correct);
    const missed = scored.filter(q => quizState.answers[q.id] !== q.correct);
    const correct = scored.length - missed.length;
    const rank = SURVEY.ranks ? SURVEY.ranks.find(r => correct >= r.min) : null;
    const review = missed.length ? `
        <div class="qReview">
          <p class="qReviewTitle">${ui.reviewTitle}</p>
          ${missed.map(q => {
            const right = q.options.find(o => o.value === q.correct);
            return `<p><b>${(q.kicker && q.kicker[L]) || ''}</b><br>${ui.correctLabel} ${right.label[L]}</p>`;
          }).join('')}
        </div>` : '';
    view.innerHTML = `
      <div class="qTop"><button class="qBack" id="qBackBtn" type="button">${ui.back}</button></div>
      <div class="qDone">
        <p style="font-weight:600;font-size:17px;margin:0 0 18px">${ui.doneTitle}</p>
        <p class="score">${correct}/${scored.length}</p>
        <p class="note" style="margin:0 0 18px">${ui.doneScore}</p>
        ${rank ? `<p class="note" style="margin:0">${ui.rankLabel}</p>
        <p class="qRank">${rank.label[L]}</p>` : ''}
        <p class="note">${ui.doneBody}</p>
        ${review}
      </div>
      <div class="qNav"><button class="qBtn primary" id="qDoneBtn" type="button">${ui.doneBtn}</button></div>`;
    document.getElementById('qBackBtn').onclick = closeQuiz;
    document.getElementById('qDoneBtn').onclick = closeQuiz;
    return;
  }

  const section = SURVEY.sections[quizState.section];
  const isLast = quizState.section === SURVEY.sections.length - 1;
  const isFirst = quizState.section === 0;
  const dots = SURVEY.sections.map((s,i) => `<span class="qDot${i===quizState.section?' on':''}"></span>`).join('');

  const qHtml = section.questions.map(q => {
    const val = quizState.answers[q.id];
    let inputHtml = '';
    if(q.type === 'text'){
      inputHtml = `<input class="qInput" type="text" data-qid="${q.id}" placeholder="${esc((q.placeholder && q.placeholder[L]) || '')}" value="${val ? esc(val) : ''}">`;
    } else if(q.type === 'long'){
      inputHtml = `<textarea class="qInput" rows="3" data-qid="${q.id}">${val ? esc(val) : ''}</textarea>`;
    } else if(q.type === 'radio'){
      const order = quizState.order[q.id] || q.options.map((o,i) => i);
      inputHtml = order.map(i => q.options[i]).map(o => `
        <button type="button" class="qOption${val===o.value?' sel':''}" data-qid="${q.id}" data-val="${esc(o.value)}">${o.label[L]}</button>`).join('');
    } else if(q.type === 'checkbox'){
      const picked = Array.isArray(val) ? val : [];
      inputHtml = q.options.map(o => `
        <button type="button" class="qOption qCheck${picked.includes(o.value)?' sel':''}" aria-pressed="${picked.includes(o.value)}" data-qid="${q.id}" data-check="${esc(o.value)}">${o.label[L]}</button>`).join('');
    } else if(q.type === 'scale'){
      const wide = q.values.length > 6 ? ' wide' : '';
      inputHtml = `
        <div class="qScale${wide}">${q.values.map((v,i) => `<button type="button" class="qScaleBtn${val===v?' sel':''}" data-qid="${q.id}" data-val="${esc(v)}">${scaleNum(v, L)}</button>`).join('')}</div>
        ${q.low ? `<div class="qScaleLabels"><span>${q.low[L]}</span><span>${q.high[L]}</span></div>` : '<div style="height:12px"></div>'}`;
    } else if(q.type === 'grid'){
      const g = val || {};
      inputHtml = q.rows.map((r,ri) => `
        <div class="qGridRow">
          <p class="qGridLabel">${r.label[L]}</p>
          <div class="qGridBtns">${q.columns.map(c => `<button type="button" class="qGridBtn${c.na?' na':''}${g[ri]===c.value?' sel':''}" data-qid="${q.id}" data-row="${ri}" data-val="${esc(c.value)}">${c.label[L]}</button>`).join('')}</div>
        </div>`).join('');
    }
    return `
      <div class="qQuestion">
        ${q.kicker ? `<p class="qKicker">${q.kicker[L]}</p>` : ''}
        <p class="qText">${q.text[L]}</p>
        ${q.help ? `<p class="qHelp">${q.help[L]}</p>` : ''}
        ${inputHtml}
        <p class="qErr" data-qerr="${q.id}" hidden>${ui.required}</p>
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="qTop">
      <button class="qBack" id="qBackBtn" type="button">${isFirst ? ui.back : (L==='fa' ? '→' : '←')}</button>
      <div class="qDots">${dots}</div>
    </div>
    <div class="qBody">
      <p class="qSectionTitle">${section.title[L]}</p>
      ${section.intro ? `<p class="qIntro">${section.intro[L]}</p>` : ''}
      ${qHtml}
    </div>
    <div class="qNav"><button class="qBtn primary" id="qNextBtn" type="button">${isLast ? ui.submit : ui.next}</button></div>`;

  document.getElementById('qBackBtn').onclick = () => {
    if(isFirst){ closeQuiz(); } else { quizState.section--; renderQuizSection(); window.scrollTo(0, 0); }
  };

  view.querySelectorAll('.qInput').forEach(el => {
    el.oninput = () => { quizState.answers[el.dataset.qid] = el.value; };
  });
  view.querySelectorAll('.qOption[data-val], .qScaleBtn').forEach(el => {
    el.onclick = () => { quizState.answers[el.dataset.qid] = el.dataset.val; renderQuizSection(); };
  });
  view.querySelectorAll('.qCheck').forEach(el => {
    el.onclick = () => {
      const q = allQuestions().find(x => x.id === el.dataset.qid);
      let picked = Array.isArray(quizState.answers[q.id]) ? quizState.answers[q.id].slice() : [];
      const v = el.dataset.check;
      if(picked.includes(v)){
        picked = picked.filter(x => x !== v);
      } else if(v === q.exclusive){
        picked = [v];
      } else {
        picked = picked.filter(x => x !== q.exclusive).concat(v);
      }
      // Keep the same order as the Google Form.
      quizState.answers[q.id] = q.options.map(o => o.value).filter(x => picked.includes(x));
      renderQuizSection();
    };
  });
  view.querySelectorAll('.qGridBtn').forEach(el => {
    el.onclick = () => {
      const g = Object.assign({}, quizState.answers[el.dataset.qid] || {});
      g[el.dataset.row] = el.dataset.val;
      quizState.answers[el.dataset.qid] = g;
      renderQuizSection();
    };
  });

  document.getElementById('qNextBtn').onclick = () => {
    let ok = true, firstErr = null;
    section.questions.forEach(q => {
      const errEl = view.querySelector(`[data-qerr="${q.id}"]`);
      if(!q.optional && !isAnswered(q)){
        ok = false;
        if(errEl){ errEl.hidden = false; if(!firstErr) firstErr = errEl; }
      } else if(errEl){ errEl.hidden = true; }
    });
    if(!ok){ firstErr.parentElement.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    if(isLast){ submitQuiz(); } else { quizState.section++; renderQuizSection(); window.scrollTo(0, 0); }
  };
}

function submitQuiz(){
  const L = SURVEY.ui[langEl.value] ? langEl.value : 'en';
  if(!navigator.onLine){ alert(SURVEY.ui[L].offline); return; }

  const body = new URLSearchParams();
  allQuestions().forEach(q => {
    const v = quizState.answers[q.id];
    if(q.type === 'grid'){
      q.rows.forEach((r,i) => body.append(r.entry, (v && v[i]) || ''));
    } else if(q.type === 'checkbox'){
      (v || []).forEach(x => body.append(q.entry, x));
    } else {
      body.append(q.entry, v === undefined ? '' : String(v).trim());
    }
  });
  body.append('pageHistory', SURVEY.pageHistory);
  body.append('fvv', '1');

  // Google does not let the page see its reply (cross-origin), so we show
  // our own results screen either way.
  fetch(SURVEY.formBase, { method:'POST', mode:'no-cors', body }).catch(() => {});

  quizState.done = true;
  renderQuizSection();
  window.scrollTo(0, 0);
}


/* ============================================================
   FLOOR PLANS

   The images live in the "maps" folder: floor-N.webp is the full plan
   (opened on tap, then saved on the phone for offline use) and
   floor-N-small.webp is the little preview in the list.
   To add a floor or a building, make both files and add a line below.
   ============================================================ */

const FLOOR_MAPS = [
  { file:'maps/floor-4', num:{en:'4', ru:'4', fa:'۴'}, label:{en:'4th floor', ru:'4 этаж', fa:'طبقهٔ چهارم'} },
  { file:'maps/floor-3', num:{en:'3', ru:'3', fa:'۳'}, label:{en:'3rd floor', ru:'3 этаж', fa:'طبقهٔ سوم'} },
  { file:'maps/floor-2', num:{en:'2', ru:'2', fa:'۲'}, label:{en:'2nd floor', ru:'2 этаж', fa:'طبقهٔ دوم'} },
  { file:'maps/floor-1', num:{en:'1', ru:'1', fa:'۱'}, label:{en:'1st floor', ru:'1 этаж', fa:'طبقهٔ اول'} },
  { file:'maps/floor-0', num:{en:'LG', ru:'Ц', fa:'ز'}, label:{en:'Lower ground floor', ru:'Цокольный этаж', fa:'طبقهٔ زیرزمین'} }
];
const MAP_UI = {
  en:{ loading:'Loading the plan…', offline:'This plan has not been saved yet. Open it once with internet, then it works offline.', close:'Close', zoomIn:'Zoom in', zoomOut:'Zoom out' },
  ru:{ loading:'Загружаем план…', offline:'Этот план ещё не сохранён. Откройте его один раз с интернетом — потом он будет работать без сети.', close:'Закрыть', zoomIn:'Увеличить', zoomOut:'Уменьшить' },
  fa:{ loading:'در حال بارگذاری نقشه…', offline:'این نقشه هنوز ذخیره نشده است. یک بار با اینترنت بازش کنید تا بعداً بدون اینترنت هم کار کند.', close:'بستن', zoomIn:'بزرگ‌نمایی', zoomOut:'کوچک‌نمایی' }
};

function mapLang(){ return MAP_UI[langEl.value] ? langEl.value : 'en'; }

function renderFloorMaps(code){
  const L = MAP_UI[code] ? code : 'en';
  const box = document.getElementById('floorMaps');
  if(!box) return;
  box.innerHTML = FLOOR_MAPS.map((m,i) => `
    <button type="button" class="mapRow" data-map="${i}">
      <span class="mapNum">${m.num[L]}</span>
      <span class="mapName">${m.label[L]}</span>
      <img class="mapThumb" src="${m.file}-small.webp" alt="" loading="lazy" width="130" height="38">
    </button>`).join('');
  box.querySelectorAll('.mapRow').forEach(b => { b.onclick = () => openMap(+b.dataset.map); });
}

const mapView = document.getElementById('mapView');
const mapScroll = document.getElementById('mapScroll');
const mapImg = document.getElementById('mapImg');
let mapZoom = 1, mapMaxZoom = 8, mapOpenedFrom = null;

// zoom = 1 means "the whole plan fits the screen width"
function setMapZoom(z, cx, cy){
  if(!mapImg.naturalWidth) return;
  const W = mapScroll.clientWidth, H = mapScroll.clientHeight;
  if(cx === undefined){ cx = W / 2; cy = H / 2; }
  z = Math.max(1, Math.min(mapMaxZoom, z));
  const oldW = mapImg.offsetWidth || W, oldH = mapImg.offsetHeight || W;
  const fx = (mapScroll.scrollLeft + cx) / oldW;
  const fy = (mapScroll.scrollTop + cy) / oldH;
  mapZoom = z;
  mapImg.style.width = Math.round(W * z) + 'px';
  mapScroll.scrollLeft = fx * mapImg.offsetWidth - cx;
  mapScroll.scrollTop = fy * mapImg.offsetHeight - cy;
}

function openMap(i){
  const m = FLOOR_MAPS[i], L = mapLang(), ui = MAP_UI[L];
  mapOpenedFrom = document.activeElement;
  document.getElementById('mapTitle').textContent = m.label[L];
  document.getElementById('mapClose').setAttribute('aria-label', ui.close);
  document.getElementById('mapIn').setAttribute('aria-label', ui.zoomIn);
  document.getElementById('mapOut').setAttribute('aria-label', ui.zoomOut);
  const loading = document.getElementById('mapLoading');
  loading.textContent = ui.loading;
  loading.hidden = false;
  mapImg.style.visibility = 'hidden';
  mapImg.alt = m.label[L];
  mapView.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ floorMap:i }, '');
  mapImg.onload = () => {
    loading.hidden = true;
    mapImg.style.visibility = '';
    const W = mapScroll.clientWidth, H = mapScroll.clientHeight;
    mapMaxZoom = Math.max(2, mapImg.naturalWidth / W);
    mapImg.style.width = W + 'px';
    mapZoom = 1;
    // On a tall phone screen, start zoomed in so the plan fills the height.
    setMapZoom(Math.min(3, H * (mapImg.naturalWidth / mapImg.naturalHeight) / W), W / 2, 0);
    mapScroll.scrollTop = 0;
  };
  mapImg.onerror = () => { loading.textContent = navigator.onLine ? ui.loading : ui.offline; };
  mapImg.removeAttribute('src');
  mapImg.src = m.file + '.webp';
  document.getElementById('mapClose').focus();
}

function hideMap(){
  if(mapView.hidden) return;
  mapView.hidden = true;
  document.body.style.overflow = '';
  if(mapOpenedFrom && mapOpenedFrom.focus) mapOpenedFrom.focus();
}
// The phone's back button closes the plan instead of leaving the site.
window.addEventListener('popstate', hideMap);
document.getElementById('mapClose').onclick = () => { if(history.state && history.state.floorMap !== undefined) history.back(); else hideMap(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !mapView.hidden) document.getElementById('mapClose').click(); });
document.getElementById('mapIn').onclick = () => setMapZoom(mapZoom * 1.6);
document.getElementById('mapOut').onclick = () => setMapZoom(mapZoom / 1.6);

// Two-finger pinch to zoom around the fingers.
let pinch = null, lastTap = 0;
const touchDist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
mapScroll.addEventListener('touchstart', e => {
  if(e.touches.length === 2){ pinch = { d: touchDist(e.touches[0], e.touches[1]), z: mapZoom }; }
}, { passive:true });
mapScroll.addEventListener('touchmove', e => {
  if(!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches, r = mapScroll.getBoundingClientRect();
  setMapZoom(pinch.z * touchDist(a, b) / pinch.d, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top);
}, { passive:false });
mapScroll.addEventListener('touchend', e => {
  if(e.touches.length < 2) pinch = null;
  // Double-tap: zoom in, or back out when already fully zoomed.
  if(e.touches.length === 0 && e.changedTouches.length === 1){
    const now = Date.now(), t = e.changedTouches[0], r = mapScroll.getBoundingClientRect();
    if(now - lastTap < 300){
      setMapZoom(mapZoom >= mapMaxZoom * 0.95 ? 1 : mapZoom * 2, t.clientX - r.left, t.clientY - r.top);
      lastTap = 0;
    } else lastTap = now;
  }
});
// iPhone Safari: stop the whole page from zooming instead of the plan.
['gesturestart','gesturechange'].forEach(ev => mapScroll.addEventListener(ev, e => e.preventDefault()));
// Computer: Ctrl + mouse wheel (or trackpad pinch) zooms, double-click zooms in.
mapScroll.addEventListener('wheel', e => {
  if(!e.ctrlKey) return;
  e.preventDefault();
  const r = mapScroll.getBoundingClientRect();
  setMapZoom(mapZoom * Math.exp(-e.deltaY / 300), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
mapScroll.addEventListener('dblclick', e => {
  const r = mapScroll.getBoundingClientRect();
  setMapZoom(mapZoom >= mapMaxZoom * 0.95 ? 1 : mapZoom * 2, e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener('resize', () => { if(!mapView.hidden) setMapZoom(mapZoom); });

window.floorMapsReady = true;
renderFloorMaps(langEl.value);

SURVEYS.forEach((sv, i) => { document.getElementById('quizLaunchBtn' + i).onclick = () => openQuiz(i); });

// Everything above is defined by now, so it is safe to fill the quiz card.
renderQuizLaunch();
</script>
</body>
</html>
